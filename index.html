<!DOCTYPE html>

<title>Mus</title>
<style>
:root{--felt:#1f5a3a;--felt2:#17472d;--card:#f6efdc;--ink:#1d2a44;--mute:#6d6a5f;--a:#b3392f;--b:#1d4f7a;--af:#f0867a;--bf:#6fb0e6;--gold:#c8962b;--line:#d9ceb4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#123423;--felt2:#0d281a;--card:#232c44;--ink:#f1e8d0;--mute:#9aa0b3;--a:#e2675a;--b:#6fb0e6;--gold:#e0b04a;--line:#34405f}}
:root[data-theme="dark"]{--felt:#123423;--felt2:#0d281a;--card:#232c44;--ink:#f1e8d0;--mute:#9aa0b3;--a:#e2675a;--b:#6fb0e6;--gold:#e0b04a;--line:#34405f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--felt2);color:var(--ink);font-family:"Avenir Next",system-ui,sans-serif;max-width:520px;margin:0 auto}
#app{height:100%;min-height:0;overflow-y:auto;overscroll-behavior:none;display:flex;flex-direction:column;gap:12px;padding:28px 22px;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));box-shadow:inset 0 0 0 8px #101010,inset 0 0 0 11px var(--gold),inset 0 0 0 13px #101010}
h1{font:700 30px Georgia,serif;color:#f6efdc;margin:0;text-align:center}
h2{font:700 22px Georgia,serif;margin:0}
.card{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
button{font:600 16px inherit;border:0;border-radius:12px;padding:13px;background:var(--ink);color:var(--card);touch-action:manipulation}
button.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
button.gold{background:var(--gold);color:#1d2a44;font:700 22px Georgia,serif;padding:20px}
button:disabled{opacity:.4}
input,select{font-size:16px;font-family:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);width:100%}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.nav{display:flex;justify-content:space-between;margin-top:auto}
.nav button{background:var(--card);color:var(--ink);flex:0 0 46%}
.top{display:flex;align-items:center;gap:10px}.top button{flex:0 0 auto;padding:9px 14px;background:var(--card);color:var(--ink)}
.top h2{color:#f6efdc}
.sep{height:1px;background:var(--line)}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fr button{padding:7px 12px;background:none;color:var(--a);border:1.5px solid var(--a);flex:0 0 auto}
.team{border:3px solid var(--cf,var(--c));border-radius:16px}
.big{font:700 64px/1 Georgia,serif;color:var(--c)}
.dots{display:flex;flex-wrap:wrap;gap:5px 9px}.grp{display:flex;gap:3px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--c)}.dot.on{background:var(--c)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns button{background:var(--c);color:#fff;font:700 20px Georgia,serif}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
#app.game{padding:18px 14px;height:100%;overflow-y:auto}
.table{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.half{flex:1;background:var(--card);padding:10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:0}
.rot{transform:rotate(180deg)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mini button{background:none;color:var(--c);border:1.5px solid var(--c);padding:8px 0;font:700 15px Georgia,serif}
.half .big{font-size:52px}.half .btns button{padding:10px}.half .row input{padding:9px}
.half .row button{padding:10px 14px;flex:0 0 auto;background:var(--c);color:#fff}
.mid{display:flex;flex-direction:column;gap:8px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px;color:#f6efdc}.strip .dot{border-color:#f6efdc}.strip .dot.on{background:var(--c)}.cnt{display:flex;gap:12px;font:700 20px Georgia,serif;white-space:nowrap}

.grp.soon{background:rgba(242,183,5,.25);border-radius:8px;padding:2px 4px;margin:-2px -4px}.strip .grp.last .dot{border-color:#f2b705}.strip .grp.last .dot.on{background:#f2b705;box-shadow:0 0 6px #f2b705}
.acts{display:flex;gap:8px;align-items:center}.acts button{flex:1;padding:12px;background:var(--card);color:var(--ink)}
.acts .gold{flex:2;font:700 17px Georgia,serif;padding:12px;background:var(--gold);color:#1d2a44}
.ov{position:fixed;inset:0;max-width:520px;margin:0 auto;background:rgba(0,0,0,.75);display:flex;flex-direction:column;gap:14px;padding:22px 16px;z-index:9}
.mp{flex:1;background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;align-content:center}
.mesa{display:flex;gap:6px;align-items:stretch}
.sm{flex:0 0 42px;padding:0;background:var(--card);color:var(--ink);font-size:20px;border-radius:10px}
.slot{flex:1;position:relative;height:68px;border:1.5px dashed rgba(246,239,220,.6);border-radius:10px;display:flex;align-items:center;justify-content:center}
.cn{position:absolute;left:5px;top:2px;font:700 12px Georgia,serif;color:#f6efdc}
.cn.r{left:auto;top:auto;right:5px;bottom:2px}
.plus{color:#f6efdc;font:700 24px Georgia,serif}
.chip{position:relative;width:40px;height:54px;background:#f6efdc;border:2px solid #c8962b;border-radius:7px;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45);z-index:2}
.chip>b{position:absolute;left:4px;top:1px;font:700 14px Georgia,serif;color:#1d2a44}
.chip>b.rot{left:auto;top:auto;right:4px;bottom:1px}
.snd{position:absolute;left:-10px;right:-10px;top:-36px;bottom:-36px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.snd button{pointer-events:auto;padding:5px 0;background:var(--gold);color:#1d2a44;font-size:16px}
.half .fr{flex-wrap:wrap}.half .all{padding:6px 10px;font-size:13px;background:var(--c);color:#fff;border:0}
.opts.g5{grid-template-columns:repeat(5,1fr);gap:6px}.opts.g5 button{padding:9px 0}.u{text-decoration:none;display:inline-block;line-height:.95;border-bottom:.06em solid currentColor}.chip .u{font-size:.8em;line-height:.9;border-bottom-width:1px}.u.n9{padding-bottom:.2em}.chip>b{line-height:1}.chip svg{width:17px;height:17px}
.riv{display:flex;align-items:baseline;gap:5px;border:2px solid var(--r);color:var(--r);border-radius:10px;padding:1px 9px}
.riv small{font-size:11px}.riv b{font:700 26px Georgia,serif}
.del{position:absolute;top:-13px;right:-13px;width:28px;height:28px;border-radius:50%;background:#b3392f;color:#fff;padding:0;font-size:14px;z-index:5;border:2px solid #f6efdc}
.opts.g1{grid-template-columns:1fr}.plus svg{opacity:.6}
.ov.c{justify-content:center}.ov.c .mp{flex:0 0 auto}
textarea{font-size:16px;font-family:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);width:100%}.card td,.card th{font-size:13px}
.half .ord{padding:9px 14px;background:#f2b705;color:#1d2a44;font:700 15px Georgia,serif;border:0;flex:0 0 auto}
.fx{position:fixed;inset:0;max-width:520px;margin:0 auto;pointer-events:none;z-index:30;overflow:hidden}
.flash{position:absolute;left:0;right:0;height:50%;background:radial-gradient(ellipse at center,rgba(242,183,5,.8),rgba(242,183,5,0) 72%);opacity:0;animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.ficha{position:absolute;left:50%;margin-left:-37px;width:74px;height:100px;background:#f6efdc;border:3px solid #c8962b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0}
.ficha b{font:700 64px/1 Georgia,serif;color:#000}
.f0{top:62%;animation:up0 1.4s ease-out forwards}.f1{top:calc(38% - 100px);animation:up1 1.4s ease-out forwards}
@keyframes up0{0%{transform:translateY(30px) scale(.5);opacity:0}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{transform:translateY(-200px) scale(1);opacity:0}}
@keyframes up1{0%{transform:rotate(180deg) translateY(30px) scale(.5);opacity:0}20%{opacity:1;transform:rotate(180deg) translateY(0) scale(1.1)}100%{transform:rotate(180deg) translateY(-200px) scale(1);opacity:0}}
.drop{position:absolute;top:-50px;pointer-events:none;animation-name:fall;animation-timing-function:linear;animation-fill-mode:both}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(calc(100vh + 80px)) rotate(var(--r,360deg))}}
.vic{overflow:hidden}.vic .mp{align-items:center;justify-content:center;text-align:center}.vp h2{font-size:26px;color:var(--ink)}.vp small{font:700 14px Georgia,serif;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.vp .sub{color:var(--mute)}
.vsi{display:block;padding:0;background:rgba(7,26,16,.94);z-index:32;transition:opacity .4s;animation:vsin .4s ease-out}
@keyframes vsin{from{opacity:0}to{opacity:1}}
.vs-g{position:absolute;width:min(80%,340px);display:flex;flex-direction:column;gap:14px}
.vs-g.g0{right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.vs-g.g1{left:16px;top:calc(18px + env(safe-area-inset-top,0px));transform:rotate(180deg)}
.vs-pls{display:flex;flex-direction:column;gap:14px}
.vs-pl{display:flex;flex-direction:column;gap:6px}
.vs-n{display:flex;align-items:baseline;justify-content:space-between;gap:10px;color:#f6efdc}
.vs-n b{font:700 24px Georgia,serif;overflow-wrap:anywhere}
.vs-n span{font:13px system-ui;color:#bcd9ff;white-space:nowrap}
.vs-bn{padding:12px 28px;text-align:center;color:#fff;font:700 18px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%)}
.vs-jt{text-align:center;font:italic 700 15px Georgia,serif;color:#bcd9ff}
.vs-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--gold);color:#1d2a44;border:3px solid #1d2a44;display:flex;align-items:center;justify-content:center;font:900 20px Georgia,serif;box-shadow:0 4px 14px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){.fx{display:none}.drop{display:none}}

#app.home{position:relative;padding:76px 22px 84px;gap:0}
.cn4{position:absolute;display:block;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.cn4.tl{top:22px;left:22px}.cn4.tr{top:22px;right:22px}
.cn4.bl{bottom:22px;left:22px}.cn4.br{bottom:22px;right:22px}
.logo{font:700 clamp(76px,24vw,112px)/1 Georgia,serif;letter-spacing:.06em;margin:4vh 0 0;text-align:center;color:#f6efdc;text-shadow:0 3px 0 #7a5a12,0 0 22px rgba(224,176,74,.55)}
.fan{position:relative;height:clamp(170px,27vh,230px);margin:2vh 0 0}
.fan .ac{position:absolute;left:50%;bottom:0;width:clamp(78px,24vw,108px);aspect-ratio:300/465;margin-left:calc(clamp(78px,24vw,108px)/-2);transform-origin:50% 140%;filter:drop-shadow(0 5px 7px rgba(0,0,0,.55))}
.fan .ac img{display:block;width:100%;height:100%;border-radius:6.6%/4.3%;box-shadow:0 0 0 2.5px #c8962b,0 0 0 3.6px rgba(58,38,6,.6),inset 0 0 0 1px rgba(255,238,180,.5);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fan .ac:nth-child(1){transform:translateX(-72%) rotate(-21deg)}.fan .ac:nth-child(2){transform:translateX(-24%) rotate(-7deg)}
.fan .ac:nth-child(3){transform:translateX(24%) rotate(7deg)}.fan .ac:nth-child(4){transform:translateX(72%) rotate(21deg)}
.menu{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;margin-top:3vh}
.vic .mp{position:relative;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));border:4px solid var(--gold);box-shadow:inset 0 0 0 3px var(--felt2),inset 0 0 0 5px var(--gold),0 6px 24px rgba(0,0,0,.5)}
.vic .mp .cn4{}.vic .vp h2{color:#f6efdc;font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.35)}.vic .vp small{color:#e0b04a}.vic .vp .sub{color:#d9ceb4}
.vic .mp .cn4.tl{top:16px;left:16px}.vic .mp .cn4.tr{top:16px;right:16px}.vic .mp .cn4.bl{bottom:16px;left:16px}.vic .mp .cn4.br{bottom:16px;right:16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shop-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc{position:relative;aspect-ratio:300/465;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 13px system-ui;cursor:pointer}
.sc i{position:absolute;top:3px;left:5px;font:700 10px Georgia,serif;font-style:normal;opacity:.6}
.sc.off{background:rgba(255,255,255,.3);border:1.5px dashed var(--mute);color:var(--ink);opacity:.6}
.sc.on.img{background:none;border:0;border-radius:9px;box-shadow:0 0 9px 2px rgba(224,176,74,.85)}.sc.on.img img{width:100%;height:100%;display:block;filter:brightness(1.07) saturate(1.15)}
.sc.off.img{background:none;border:0;opacity:1}.sc.off.img img{width:100%;height:100%;display:block;filter:brightness(.38) saturate(.55)}
.sc.off .pr{position:absolute;left:0;right:0;bottom:6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff;text-shadow:0 1px 3px #000}
.sc.on{background:#f6efdc;border:1px solid var(--line);color:#1d2a44;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#app.friends,#app.stats{overflow:hidden}
#app.shop{height:auto;min-height:100%;overflow:visible}
#app.friends #list{flex:1 1 auto;min-height:70px;overflow-y:auto}
.tabs{display:flex;gap:6px;flex:0 0 auto}.tabs button{flex:1;padding:9px 2px;font-size:13px;background:var(--card);color:var(--ink);opacity:.65}.tabs button.on{opacity:1;background:var(--gold);color:#1d2a44}
.tabbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#app.home{padding:max(58px,8vh) 22px max(60px,8vh)}
#app.home .logo{font-size:clamp(60px,13vh,112px);margin-top:1vh}

#app.home .menu{gap:8px;margin-top:1.5vh}#app.home .menu button{padding:11px}#app.home .menu .gold{padding:14px}

<body>
<div id="app"></div>
<script>
const KEY='mus-v2';
let S={friends:[],hist:[],cfg:{meta:30,juegos:3,vacas:1},game:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
S.hist.forEach((h,i)=>{if(!h.id)h.id='h'+h.fecha+'x'+i});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s), app=$('#app');
const fname=id=>{const f=S.friends.find(x=>x.id===id);return f?f.name:'(borrado)'};
const live=()=>S.friends.filter(f=>!f.deleted);
{const c=S.cfg||{};if(!S.cfg||(+c.meta===40&&+c.juegos===3&&+c.vacas===3))S.cfg={meta:30,juegos:3,vacas:1};
let n=0;while(live().length<4){n++;const nm='Jugador '+n;if(!S.friends.some(f=>!f.deleted&&f.name.toLowerCase()===nm.toLowerCase()))S.friends.push({id:'fj'+Date.now().toString(36)+n,name:nm})}
S.friends.forEach(f=>{if(typeof f.coins!=='number')f.coins=10;if(!Array.isArray(f.cards))f.cards=[]});
try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

  t[w].forEach(id=>up(id,bet+bonus));t[1-w].forEach(id=>up(id,-bet));return bet+bonus}

const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

const cfgOf=c=>({meta:+(c||{}).meta||40,juegos:+(c||{}).juegos||3,vacas:+(c||{}).vacas||3});
function showLink(url){
  const d=document.createElement('div');d.className='ov c';
  d.innerHTML='<div class="mp"><textarea id="dl" rows="5"></textarea><div class="row"><button class="ghost" id="dc">Cerrar</button><button id="dk">Copiar texto</button></div></div>';
  const t=d.querySelector('#dl');t.value=url;t.onfocus=()=>t.select();document.body.appendChild(d);
  d.querySelector('#dc').onclick=()=>d.remove();
  d.querySelector('#dk').onclick=async e=>{const b=e.target;try{await navigator.clipboard.writeText(url)}catch(x){t.focus();t.select();try{document.execCommand('copy')}catch(y){}}b.textContent='¡Copiado!'};
}

function shareResult(r){sendMsg({k:'r',i:r.id,n:[...r.t[0],...r.t[1]].map(fname),w:r.w,b:r.b||0,c:r.cfg,f:r.fecha,x:(r.o||[]).map(oe)},'Resultado de la partida de mus:')}
function exportBackup(){
  const a=S.friends.map(f=>f.name),ix=id=>S.friends.findIndex(f=>f.id===id);
  const h=S.hist.map(x=>{const c=cfgOf(x.cfg);return[ix(x.t[0][0]),ix(x.t[0][1]),ix(x.t[1][0]),ix(x.t[1][1]),x.w,x.fecha,x.id,c.meta,c.juegos,c.vacas,(x.o||[]).map(e=>[...e.w,...e.l].map(ix))]}).filter(r=>r.slice(0,4).every(i=>i>=0));
  const d=S.friends.map((f,i)=>f.deleted?i:-1).filter(i=>i>=0);
  showLink(LINK+'#'+enc({k:'b',i:uid(),a,d,h,m:S.friends.map(f=>f.coins),q:S.friends.map(f=>f.cards||[])}));
}
function importBackup(o){
  const names=(o.a||[]).map(x=>String(x).slice(0,16)),del=new Set(o.d||[]);
  const rows=(o.h||[]).filter(r=>Array.isArray(r)&&r.length>=10&&r.slice(0,4).every(i=>names[i]!==undefined));
  const have=new Set(S.hist.map(h=>h.id)),nr=rows.filter(r=>!have.has(String(r[6])));
  const nf=names.filter(n=>!S.friends.some(f=>f.name.toLowerCase()===n.toLowerCase())).length;
  if(!nr.length&&!nf){dlg('Esta copia no trae nada nuevo: ya lo tienes todo.',{});return}
  dlg('¿Restaurar la copia? Se añadirán '+nr.length+' partidas y '+nf+' amigos nuevos. No se borra nada de lo que ya tienes.',{cancel:1,ok:'Restaurar'},()=>{
    const ids=names.map((n,i)=>{let f=S.friends.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!f){f={id:'f'+uid(),name:n,deleted:del.has(i),coins:Number.isFinite(+(o.m||[])[i])?Math.max(0,+(o.m||[])[i]):10,cards:Array.isArray((o.q||[])[i])?o.q[i].filter(x=>typeof x==='string'):[]};S.friends.push(f)}return f.id});
    nr.forEach(r=>S.hist.push({id:String(r[6]),t:[[ids[r[0]],ids[r[1]]],[ids[r[2]],ids[r[3]]]],w:r[4]===1?1:0,cfg:cfgOf({meta:r[7],juegos:r[8],vacas:r[9]}),fecha:+r[5]||Date.now(),o:(Array.isArray(r[10])?r[10]:[]).filter(e=>Array.isArray(e)&&e.length===4&&e.every(i=>ids[i]!==undefined)).map(e=>({w:[ids[e[0]],ids[e[1]]],l:[ids[e[2]],ids[e[3]]]}))}));
    save();go('stats')});
}
const ordIn=x=>(Array.isArray(x)?x:[]).filter(e=>Array.isArray(e)&&e.length===4).map(e=>{const d=e.map(friendId);return{w:[d[0],d[1]],l:[d[2],d[3]]}});
function friendId(n){n=String(n).trim().slice(0,16)||'Jugador';let f=S.friends.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!f){f={id:'f'+uid(),name:n,coins:10};S.friends.push(f)}else f.deleted=false;return f.id}
function tryImport(t,auto){
  let o;try{o=dec(String(t).trim().split(/\s+/).pop().split('#').pop())}catch(e){}
  if(o&&o.k==='b'){importBackup(o);return}
  if(!o||!o.k||!Array.isArray(o.n)||o.n.length!==4){if(!auto)dlg('El código no es válido.',{});return}
  S.seen=S.seen||[];const key=o.k+o.i;
  if(auto&&S.seen.includes(key))return;
  const mark=()=>{S.seen=[...S.seen,key].slice(-30)},nm=o.n.map(x=>String(x).slice(0,16));
  if(o.k==='r'){
    const w=o.w===1?1:0;
    if(S.hist.some(h=>h.id===o.i)){mark();save();dlg('Este resultado ya estaba en tu historial.',{});return}
    dlg('¿Añadir este resultado al historial? Ganan '+nm[w*2]+' y '+nm[w*2+1]+'.',{cancel:1,ok:'Añadir'},()=>{
      const d=nm.map(friendId),bt=Math.max(0,+o.b||0),rc={id:o.i,t:[[d[0],d[1]],[d[2],d[3]]],w,cfg:cfgOf(o.c),fecha:+o.f||Date.now(),o:ordIn(o.x),b:bt};rc.gain=settle(rc.t,w,bt);S.hist.push(rc);mark();save();go('stats')});
  }else if(o.k==='p'&&o.s){
    dlg('Te han pasado una partida: '+nm[0]+' y '+nm[1]+' contra '+nm[2]+' y '+nm[3]+'.'+(S.game?' Sustituirá la partida que tienes ahora.':''),{cancel:1,ok:'Cargar'},()=>{
      const d=nm.map(friendId),n2=a=>[0,1].map(i=>+(a||[])[i]||0),mesa={};
      ['G','C','P','J'].forEach(l=>{const v=+(o.s.mesa||{})[l];if(v>0)mesa[l]=v});
      S.cfg=cfgOf(o.c);S.game={id:String(o.i),p:d,pts:n2(o.s.pts),jg:n2(o.s.jg),vc:n2(o.s.vc),mesa,hist:[],ord:ordIn(o.x),bet:Math.max(0,+o.b||0)};mark();save();go('game')});
  }
}
function dlg(text,o,cb){
  const d=document.createElement('div');d.className='ov c';
  d.innerHTML='<div class="mp"><b></b>'+(o.input!==undefined?(o.area?'<textarea id="dl" rows="7"></textarea>':'<input id="dl">'):'')+'<div class="row">'+(o.cancel?'<button class="ghost" id="dc">Cancelar</button>':'')+'<button id="dk">'+(o.ok||'Aceptar')+'</button></div></div>';
  d.querySelector('b').textContent=text;
  const inp=d.querySelector('#dl');if(inp)inp.value=o.input;
  document.body.appendChild(d);
  const close=v=>{d.remove();if(v&&cb)cb(inp?inp.value:true)};
  d.querySelector('#dk').onclick=()=>close(true);
  const c=d.querySelector('#dc');if(c)c.onclick=()=>close(false);
}

const PRICE=r=>r==1||r==12?40:r>=10?20:10;
const owns=(f,k)=>(f.cards||[]).includes(k),done=(f,s)=>RANKS.every(r=>owns(f,s+r));
const setIcons=(f,z)=>'<span style="display:inline-flex;gap:8px;align-items:center">'+['o','c','e','b'].map(s=>'<span style="display:inline-flex;opacity:'+(done(f,s)?1:.28)+(done(f,s)?';filter:drop-shadow(0 0 4px #e0b04a)':'')+'">'+suit(s,z)+'</span>').join('')+'</span>';
function shop(){
  const L=live(),f=L.find(x=>x.id===S.shopBuyer)||L[0],top='<div class="top"><button id="b">‹ Inicio</button><h2>Tienda</h2></div>';
  if(!f){app.innerHTML=top+'<div class="card"><span style="color:var(--mute)">Añade amigos en la biblioteca para poder comprar cartas.</span></div>';$('#b').onclick=()=>go('home');return}
  S.shopBuyer=f.id;
  app.innerHTML=top+'<div class="card"><label>Comprador<select id="who">'+L.map(x=>'<option value="'+x.id+'"'+(x.id===f.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><div class="fr"><span>'+bal(f.coins)+'</span>'+setIcons(f,26)+'</div></div>'
  +['o','c','e','b'].map(s=>'<div class="card"><div class="fr" style="justify-content:flex-start;gap:8px">'+suit(s,22)+'<b style="text-transform:capitalize">'+SN[s]+'</b><span style="color:var(--mute);font-size:13px">'+RANKS.filter(r=>owns(f,s+r)).length+'/10</span></div><div class="shop-grid">'
    +RANKS.map(r=>owns(f,s+r)?(CARDIMG[s+r]?'<div class="sc on img"><img src="'+CARDIMG[s+r]+'" alt="'+r+' de '+SN[s]+'"></div>':'<div class="sc on"><i>'+r+'</i>'+suit(s,30)+'</div>'):CARDIMG[s+r]?'<div class="sc off img" data-k="'+s+r+'"><img src="'+CARDIMG[s+r]+'" alt="'+r+' de '+SN[s]+'"><b class="pr">'+coin(15)+'<span>'+PRICE(r)+'</span></b></div>':'<div class="sc off" data-k="'+s+r+'"><i>'+r+'</i>'+coin(15)+'<span>'+PRICE(r)+'</span></div>').join('')+'</div></div>').join('');
  $('#b').onclick=()=>go('home');
  $('#who').onchange=()=>{S.shopBuyer=$('#who').value;save();shop()};
  app.querySelectorAll('.sc.off').forEach(e=>e.onclick=()=>{const k=e.dataset.k,s=k[0],r=+k.slice(1),pr=PRICE(r);
    dlg('¿Comprar el '+r+' de '+SN[s]+' por '+pr+' monedas?',{cancel:1,ok:'Comprar'},()=>{
      if(f.coins<pr){dlg('No hay monedas suficientes: el saldo es '+f.coins+'.',{});return}
      f.coins-=pr;f.cards=(f.cards||[]).concat(k);save();const y=scrollY;shop();scrollTo(0,y)})});
}
function home(){
  app.innerHTML=corners(52,28)+'<div class="logo">MUS</div>'+fan()+'<div class="menu">'+(S.game?'<button class="gold" style="width:100%" id="cont">Continuar partida</button>':'')+'<button class="'+(S.game?'ghost" style="width:100%;background:var(--card)':'gold" style="width:100%')+'" id="go">Iniciar partida</button>'
  +'<div class="nav" style="margin-top:0"><button id="st">Estadísticas</button><button id="fr">Amigos</button></div><button class="ghost" id="sh" style="width:100%;background:var(--card)">Tienda</button><button class="ghost" id="im" style="color:#f6efdc;border-color:#f6efdc">Importar código</button></div>';
  $('#go').onclick=()=>{if(live().length<4){dlg('Añade al menos 4 amigos en la biblioteca para empezar una partida.',{},()=>go('friends'))}else go('setup')};
  if($('#cont'))$('#cont').onclick=()=>go('game');
  $('#im').onclick=()=>dlg('Pega el código o el enlace que te han mandado:',{input:'',cancel:1,ok:'Importar'},v=>{if(v)tryImport(v)});
  $('#st').onclick=()=>go('stats');$('#fr').onclick=()=>go('friends');$('#sh').onclick=()=>go('shop');
}

function friends(){
  app.innerHTML='<div class="top"><button id="b">‹ Inicio</button><h2>Biblioteca de amigos</h2></div>'
  +'<div class="card"><div class="row"><input id="n" placeholder="Nombre del amigo" maxlength="16"><button id="add" style="flex:0 0 auto">Añadir</button></div></div>'
  +'<button class="ghost" id="shopb" style="width:100%;background:var(--card);color:var(--ink)">Ir a la tienda</button>'
  +'<div class="card" id="list"></div>';

function agg(w){let cur=0,best=0,g=0;w.forEach(x=>{if(x){g++;cur=cur>0?cur+1:1;best=Math.max(best,cur)}else cur=cur<0?cur-1:-1});return{j:w.length,g,p:w.length?Math.round(100*g/w.length):0,cur,best}}

function stats(){
  const H=[...S.hist].sort((a,b)=>a.fecha-b.fecha),pl={},pr={};
  H.forEach(h=>[0,1].forEach(i=>{const win=h.w===i,k=[...h.t[i]].sort().join('|');(pr[k]=pr[k]||[]).push(win);h.t[i].forEach(id=>(pl[id]=pl[id]||[]).push(win))}));
  const nm=id=>esc(fname(id)),sg=r=>(r.cur>0?'+':'')+r.cur;
  const row=(n,r)=>'<tr><td>'+n+'</td><td>'+r.j+'</td><td>'+r.g+'</td><td>'+r.p+'%</td><td>'+sg(r)+'</td><td>'+r.best+'</td></tr>';
  const head='<tr><th></th><th>Jug</th><th>Gan</th><th>%</th><th>Racha</th><th>Mejor</th></tr>';
  const P=Object.entries(pl).map(([id,w])=>[id,agg(w)]).sort((x,y)=>y[1].p-x[1].p||y[1].g-x[1].g);
  const Q=Object.entries(pr).map(([k,w])=>[k,agg(w)]).sort((x,y)=>y[1].p-x[1].p||y[1].g-x[1].g).slice(0,5);
  const op={},oq={};
  H.forEach(h=>(h.o||[]).forEach(e=>[[e.w,'g'],[e.l,'p']].forEach(([t,f])=>{const k=[...t].sort().join('|');(oq[k]=oq[k]||{g:0,p:0})[f]++;t.forEach(id=>{(op[id]=op[id]||{g:0,p:0})[f]++})})));
  const orow=(n,r)=>'<tr><td>'+n+'</td><td>'+r.g+'</td><td>'+r.p+'</td><td>'+Math.round(100*r.g/(r.g+r.p))+'%</td></tr>',ohead='<tr><th></th><th>Gan</th><th>Per</th><th>%</th></tr>';
  const so=m=>Object.entries(m).sort((x,y)=>y[1].g-x[1].g||(y[1].g/(y[1].g+y[1].p))-(x[1].g/(x[1].g+x[1].p)));

  const opts='<option value="">Elige…</option>'+S.friends.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('');
  app.innerHTML='<div class="top"><button id="b">‹ Inicio</button><h2>Estadísticas</h2></div>'
  +(H.length?'<div class="card"><b>Jugadores</b><table>'+head+P.map(([id,r])=>row(nm(id),r)).join('')+'</table></div>'
  +'<div class="card"><b>Mejores parejas</b><table>'+head+Q.map(([k,r])=>row(k.split('|').map(nm).join(' y '),r)).join('')+'</table></div>'+ordHTML
  :'<div class="card"><span style="color:var(--mute)">Todavía no hay partidas terminadas. Juega una o importa un resultado.</span></div>')
  +'<div class="card"><b>Comparar jugadores</b><div class="row"><select id="ca">'+opts+'</select><select id="cb">'+opts+'</select></div><div id="cmp"></div></div><div class="card"><b>Copia de seguridad</b><span style="color:var(--mute);font-size:13px">Crea un enlace con todo tu historial y guárdalo en Notas. Para restaurarlo, pégalo en Importar código.</span><button id="bk">Crear copia de seguridad</button></div>';
  const upd=()=>{const a=$('#ca').value,b=$('#cb').value,o=$('#cmp');

function add(i,n,rec){
  const g=S.game,c=S.cfg;
  g.hist.push(snap(g));
  let ev=null;if(rec){g.mesa={...g.mesa};delete g.mesa[rec]}
  g.pts=[...g.pts];g.pts[i]=Math.max(0,g.pts[i]+n);
  if(g.pts[i]>=c.meta){
    g.jg=[...g.jg];g.jg[i]++;g.pts=[0,0];g.mesa={};ev='j';
    if(g.jg[i]>=c.juegos){g.vc=[...g.vc];g.vc[i]++;g.jg=[0,0];ev='v'}
    if(navigator.vibrate)navigator.vibrate(ev==='v'?[120,60,120,60,200]:200);
    if(g.vc[i]<c.vacas)fx(ev,i);
    if(g.vc[i]>=c.vacas){
      const rec={id:g.id||uid(),t:[[g.p[0],g.p[1]],[g.p[2],g.p[3]]],w:i,cfg:c,fecha:Date.now(),o:g.ord||[],b:g.bet||0};rec.gain=settle(rec.t,i,rec.b);S.hist.push(rec);
      const ids=g.p.map(fname).slice(i*2,i*2+2).join(' y ');
      S.game=null;save();go('home');victory(rec,i);return;
    }
  }
  save();game();
}

function rain(box,n,loop){
  for(let k=0;k<n;k++){const s=document.createElement('span');s.className='drop';
    s.style.cssText='left:'+(Math.random()*92)+'%;animation-duration:'+(2+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*(loop?3:1.2))+'s;animation-iteration-count:'+(loop?'infinite':'1')+';--r:'+(k%4<2?Math.round(Math.random()*50-25):Math.round(Math.random()*720-360))+'deg';
    s.innerHTML=suit(['o','c','e','b'][k%4],22+Math.round(Math.random()*14));box.appendChild(s)}
}
function fx(k,i){
  const v=k==='v',d=document.createElement('div');d.className='fx';
  d.innerHTML='<div class="flash" style="'+(v?'top:0;height:100%':(i?'top:0':'bottom:0'))+'"></div><div class="ficha f'+i+'"><b>'+(v?'V':'J')+'</b></div>';
  if(v)rain(d,26,false);
  document.body.appendChild(d);setTimeout(()=>d.remove(),v?3600:1600);
}
function vsIntro(){
  const g=S.game,H=S.hist,rec=pred=>{let j=0,w=0;H.forEach(h=>[0,1].forEach(i=>{if(pred(h.t[i])){j++;if(h.w===i)w++}}));return[w,j]};
  const vw=n=>n+(n===1?' victoria':' victorias'),pt=n=>n+(n===1?' partida':' partidas');
  const d=document.createElement('div');d.className='ov vsi';
  const player=id=>{const f=S.friends.find(x=>x.id===id)||{cards:[]},[w]=rec(t=>t.includes(id));
    return '<div class="vs-pl"><div class="vs-n"><b>'+esc(fname(id))+'</b><span>'+vw(w)+'</span></div>'+setIcons(f,22)+'</div>'};
  const grp=i=>{const ids=g.p.slice(i*2,i*2+2),key=[...ids].sort().join('|'),[w,j]=rec(t=>[...t].sort().join('|')===key);
    return '<div class="vs-g g'+i+'"><div class="vs-pls">'+player(ids[0])+player(ids[1])+'</div><div class="vs-bn" style="background:'+col(i)+'">'+(i?'Equipo azul':'Equipo rojo')+'</div><div class="vs-jt">Juntos: '+(j?vw(w)+' de '+pt(j):'primera partida')+'</div></div>'};
  d.innerHTML=grp(1)+'<div class="vs-badge">VS</div>'+grp(0);
  document.body.appendChild(d);
  const out=()=>{if(!d.isConnected||d.dataset.x)return;d.dataset.x=1;d.style.opacity=0;setTimeout(()=>d.remove(),400)};
  d.onclick=out;
}
function victory(rec,i){
  const nm=rec.t[i].map(x=>esc(fname(x))).join(' y '),d=document.createElement('div');d.className='ov vic';
  const pn=r=>'<div class="mp vp'+(r?' rot':'')+'">'+corners(44,45)+'<small>¡Victoria!</small><h2>'+nm+'</h2><div class="sub">ganan la partida</div><div class="sub" style="margin-top:6px">'+coin(18)+' +'+(rec.gain||0)+' cada uno'+(rec.b?' · los rivales pierden '+rec.b:'')+'</div></div>';
  d.innerHTML=pn(1)+'<div class="row"><button id="vs" style="background:var(--gold);color:#1d2a44">Compartir resultado</button><button id="vx" style="background:var(--card);color:var(--ink)">Cerrar</button></div>'+pn(0);
  document.body.appendChild(d);rain(d,34,true);
  d.querySelector('#vx').onclick=()=>d.remove();
  d.querySelector('#vs').onclick=()=>shareResult(rec);
}
if(S.game&&S.game.pts)view='home';
draw();
{const h=location.hash.slice(1);if(h)tryImport(h,true)}
</script>
</body>
