:root{--tp1:#33684b;--tp2:#244f37;--tp3:#163324;--rim:#bf9a44;--weave:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px)}

.nd[data-l="7"]{--t1:#42424a;--t2:#222227;--t3:#09090b;--rim:#d7b754;--bi:17px;--rad:22px;--ibc:rgba(242,201,76,.4);--ac:#dec269;--sh:inset 0 0 0 4px #101010,inset 0 0 0 7px var(--rim),inset 0 0 0 9px #101010,inset 0 0 0 11px var(--rim),inset 0 0 0 12.5px #101010,inset 0 0 38px rgba(0,0,0,.55);--pat:radial-gradient(circle at 50% 100%,transparent 0 7px,rgba(200,160,80,.28) 7px 8px,transparent 8px) 0 0/26px 26px,radial-gradient(circle at 50% 100%,transparent 0 7px,rgba(200,160,80,.28) 7px 8px,transparent 8px) 13px 13px/26px 26px}
/* 9 Leyenda · esmeralda y cielo estrellado */

.nd[data-l="9"]{--t1:#3d2e6c;--t2:#1e163c;--t3:#090717;--rim:#e5c55f;--bi:15px;--rad:22px;--ibs:solid;--ibc:rgba(255,215,90,.45);--ac:#ead080;--glow:rgba(255,205,70,.9);--x:0 0 22px rgba(255,200,60,.5);--sh:inset 0 0 0 4px #101010,inset 0 0 0 8px var(--rim),inset 0 0 0 10px #101010,inset 0 0 0 11.5px var(--rim),inset 0 0 0 13px #101010,inset 0 0 38px rgba(0,0,0,.5);--pat:repeating-conic-gradient(from 0deg at 28% 50%,rgba(255,215,100,.14) 0 6deg,transparent 6deg 15deg)}

/* ===== Efecto de hundirse al pulsar ===== */
button{transition:transform .09s ease-out,filter .09s ease-out,box-shadow .09s ease-out}
button:active:not(:disabled){transform:translateY(3px) scale(.965);filter:brightness(.85)}
#app:not(.game) .top button:active,#app:not(.game) .nav button:active,#app.home .menu button.ghost:active{box-shadow:inset 0 0 0 1.5px #101010,inset 0 0 0 3px #bf9a44,inset 0 0 0 4px #101010,inset 0 4px 10px rgba(0,0,0,.6)!important}
#app.home .menu button.gold:active{box-shadow:inset 0 4px 10px rgba(0,0,0,.35)}

/* ===== Botones del inicio más grandes (Senda > Amigos / Mi perfil) ===== */
#app.home .menu{gap:12px}

/* ===== Botones principales con detalles ===== */
#app.home .menu button.gold,#app.home .menu #sd{position:relative;overflow:hidden;isolation:isolate}
/* Iniciar partida: oro bruñido con doble filete */
#app.home .menu button.gold{border:0;border-radius:16px;color:#221809;letter-spacing:.04em;
background:linear-gradient(180deg,#b39554 0%,#957c43 55%,#786131 100%);
box-shadow:inset 0 0 0 2px #30220c,inset 0 0 0 4px #c5b27c,inset 0 0 0 5.5px #725421,inset 0 -6px 10px rgba(90,56,4,.35),0 4px 0 #573f15,0 8px 14px rgba(0,0,0,.5)}

#app.home .menu button.gold::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);display:none;pointer-events:none;z-index:-1}
@keyframes brillo{0%,60%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){#app.home .menu button.gold::after{animation:none;display:none}}
#app.home .menu button.gold:active:not(:disabled){box-shadow:inset 0 0 0 2px #30220c,inset 0 0 0 4px #c5b27c,inset 0 0 0 5.5px #725421,inset 0 5px 12px rgba(60,36,2,.55),0 1px 0 #573f15!important}
/* Senda del Órdago: tapete con triple aro y costura */
#app.home .menu #sd{color:#f4e7be;text-shadow:0 2px 0 rgba(0,0,0,.5);
background:var(--weave),radial-gradient(ellipse at 30% 20%,#3d7b5a 0%,#244f37 55%,#132e20 100%)!important;
box-shadow:inset 0 0 0 2px #101010,inset 0 0 0 4.5px #c7a152,inset 0 0 0 6px #101010,inset 0 0 0 8px #bf9a44,inset 0 0 0 9px #101010,inset 0 0 22px rgba(0,0,0,.5),0 4px 0 #0d1e15,0 8px 14px rgba(0,0,0,.5)}
#app.home .menu #sd::before{content:'';position:absolute;inset:13px;border:1.5px dashed rgba(200,160,80,.45);border-radius:8px;pointer-events:none;z-index:-1}
#app.home .menu #sd::after{content:'◆ ◆';position:absolute;top:50%;left:22px;right:22px;transform:translateY(-50%);text-align:justify;text-align-last:justify;pointer-events:none;color:#c7a152;font-size:13px;line-height:1;z-index:-1}
#app.home .menu #sd:active:not(:disabled){box-shadow:inset 0 0 0 2px #101010,inset 0 0 0 4.5px #c7a152,inset 0 0 0 6px #101010,inset 0 0 0 8px #bf9a44,inset 0 0 0 9px #101010,inset 0 6px 14px rgba(0,0,0,.65),0 1px 0 #0d1e15!important}

/* ===== Marco fijo: el contenido se desliza por debajo y no se sale ===== */
#app{box-shadow:none!important}
body::after{content:'';position:fixed;top:0;bottom:0;left:50%;width:min(100%,520px);transform:translateX(-50%);pointer-events:none;z-index:8;box-shadow:inset 0 0 0 8px #101010,inset 0 0 0 11px var(--gold),inset 0 0 0 13px #101010}

/* Cierra la partida: i = pareja ganadora; inc = terminada antes de tiempo (no cuenta como victoria/derrota/racha/amarracos; sí órdagos y medallas especiales) */
function finish(i,inc){
  const g=S.game,c=S.cfg;
  const rec={id:g.id||uid(),t:[[g.p[0],g.p[1]],[g.p[2],g.p[3]]],w:i,cfg:c,fecha:Date.now(),o:g.ord||[],pl:g.pal||[0,0],rs:g.rs||[0,0],pz:g.pz||[0,0],jt:g.jt,vc:[...g.vc],am:g.am?1:0,tn:g.tn||['',''],inv:g.guest?1:0};
  if(g.inf){rec.inf=1;rec.jg=[...g.jg]}
  if(inc)rec.inc=1;
  const A=progress();ensureClaims(A);if(!g.am&&!g.guest){S.hist.push(rec);subirPartida(rec).then(ok=>{if(ok)save()})}const B=progress();subirResumen();
  S.game=null;save();go('home');victory(rec,i,A,B);
}
/* Terminar partida: gana quien va por delante (vacas, luego juegos, luego puntos) */
function endGame(){
  const g=S.game,a=[g.vc[0],g.jg[0],g.pts[0]],b=[g.vc[1],g.jg[1],g.pts[1]];
  let w=-1;for(let k=0;k<3;k++){if(a[k]!==b[k]){w=a[k]>b[k]?0:1;break}}
  if(w<0){dlg('Van empatados: todavía no hay ganador. Sigue jugando hasta que una pareja se adelante.',{cr:1});return}
  const inc=!g.inf;
  dlg(inc||g.am||g.guest?'¿Terminar partida? No contará como victoria ni derrota.':'¿Terminar partida? Contará como victoria para la pareja que va por delante y como derrota para la otra.',{cancel:1,ok:'Terminar',cr:1},()=>finish(w,inc));
}
function add(i,n,rec){
  const g=S.game,c=S.cfg;
  g.hist.push(snap(g));
  let ev=null;if(rec){g.mesa={...g.mesa};delete g.mesa[rec]}
  g.pts=[...g.pts];g.pts[i]=Math.max(0,g.pts[i]+n);
  if(c.meta>=30){g.rsf=[...(g.rsf||[false,false])];[0,1].forEach(k=>{if(g.pts[k]<=5&&g.pts[1-k]>=c.meta-5)g.rsf[k]=true})}
  if(g.pts[i]>=c.meta){
    if(g.rsf&&g.rsf[i]){g.rs=[...(g.rs||[0,0])];g.rs[i]++}g.rsf=[false,false];
    if(g.pts[1-i]===0){g.pal=[...(g.pal||[0,0])];g.pal[i]++}
    if(g.jt){g.jt=[...g.jt];g.jt[i]++}
    g.jg=[...g.jg];g.jg[i]++;g.pts=[0,0];g.mesa={};ev='j';
    if(!g.inf&&g.jg[i]>=c.juegos){if(g.jg[1-i]===0&&c.juegos>=3){g.pz=[...(g.pz||[0,0])];g.pz[i]++}g.vc=[...g.vc];g.vc[i]++;g.jg=[0,0];ev='v'}
    haptico(ev);
    if(g.inf||g.vc[i]<c.vacas)fx(ev,i);
    if(!g.inf&&g.vc[i]>=c.vacas){finish(i,0);return}
  }
  save();game();
}

/* Ajusta el contenido a la altura disponible: si no cabe, lo reduce (nunca se corta) */
function fitBox(root,boxSel,fitSel,center){
  root.querySelectorAll(boxSel).forEach(box=>{
    const f=box.querySelector(fitSel);if(!f)return;
    f.style.transform='';f.style.marginTop='';f.style.marginBottom='';
    const cs=getComputedStyle(box),av=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),need=f.offsetHeight;
    if(av>0&&need>av){const k=Math.max(.5,av/need);f.style.transform='scale('+k+')';
      if(center)f.style.marginTop=((av-need*k)/2)+'px';
      f.style.marginBottom=(-(need*(1-k)))+'px'}
  });
}

/* ===================== MODO CONECTADO (paso 7) =====================
   Varios móviles ven y editan el mismo marcador. El servidor (funciones sala_*) ordena las acciones; las reglas del mus se aplican aquí.
   · SL = sala en vivo (no se guarda). Lo que se guarda en el móvil es S.game, que sigue la forma de una partida normal + S.game.sala.
   · Cada jugador solo suma a SU equipo. Mientras suma, su compañero espera ~3 s (turno que aplica el servidor).
   · Estado del servidor = SL.srv ({j,v,g,seq}); lo que ves = SL.srv + tus toques aún sin confirmar (SL.pend). */
let SL=null;                     // sala en vivo
let INV=[],invT=0;               // invitaciones pendientes y su temporizador
let SETUP_CONN=false,SETUP_SALA=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clon=o=>JSON.parse(JSON.stringify(o));
const PARTE0=()=>({pts:0,jg:0,vc:0,pal:0,rs:0,pz:0,jt:0,fs:0,fo:0});
const juegoVacio=()=>({eq:[PARTE0(),PARTE0()],mesa:{},ord:[]});
const LAN_SL=['G','C','P','J'],LAN_NM={G:'Grande',C:'Chica',P:'Pares',J:'Juego'};
const ICO_OJOS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

/* ---------- Reglas del mus (las mismas que add() del modo local, sin pantalla ni efectos) ---------- */
function gDe(j){const e=j.eq,rf=k=>!!(e[k].fs||e[1-k].fo);
  return{pts:[e[0].pts,e[1].pts],jg:[e[0].jg,e[1].jg],vc:[e[0].vc,e[1].vc],pal:[e[0].pal,e[1].pal],rs:[e[0].rs,e[1].rs],pz:[e[0].pz,e[1].pz],jt:[e[0].jt,e[1].jt],rsf:[rf(0),rf(1)],mesa:{...(j.mesa||{})},ord:[...(j.ord||[])]}}
function jDe(g){return{eq:[0,1].map(k=>({pts:g.pts[k],jg:g.jg[k],vc:g.vc[k],pal:g.pal[k],rs:g.rs[k],pz:g.pz[k],jt:g.jt[k],fs:g.rsf[k]?1:0,fo:g.rsf[1-k]?1:0})),mesa:g.mesa,ord:g.ord}}
/* Suma n puntos al equipo i (con la ficha 'ficha' si viene de la mesa) → {j: nuevo juego, ev: null|'j'|'v', fin: se alcanzan las vacas} */
function reglasSuma(j,c,i,n,ficha){
  const g=gDe(j),meta=c.meta;let ev=null,fin=false;
  if(ficha)delete g.mesa[ficha];
  g.pts[i]=Math.max(0,g.pts[i]+n);
  if(meta>=30)[0,1].forEach(k=>{if(g.pts[k]<=5&&g.pts[1-k]>=meta-5)g.rsf[k]=true});
  if(g.pts[i]>=meta){
    if(g.rsf[i])g.rs[i]++;g.rsf=[false,false];
    if(g.pts[1-i]===0)g.pal[i]++;
    g.jt[i]++;
    g.jg[i]++;g.pts=[0,0];g.mesa={};ev='j';
    if(!c.inf&&g.jg[i]>=c.juegos){if(g.jg[1-i]===0&&c.juegos>=3)g.pz[i]++;g.vc[i]++;g.jg=[0,0];ev='v'}
    if(!c.inf&&g.vc[i]>=c.vacas)fin=true;
  }
  return{j:jDe(g),ev,fin}
}
/* Quién va por delante (vacas, luego juegos, luego puntos); -1 si empatan */
function delante(j){const g=gDe(j),a=[g.vc[0],g.jg[0],g.pts[0]],b=[g.vc[1],g.jg[1],g.pts[1]];
  for(let k=0;k<3;k++)if(a[k]!==b[k])return a[k]>b[k]?0:1;return -1}

/* ---------- Ayudas de la sala ---------- */
const miEq=()=>SL&&SL.puesto!=null?SL.puesto>>1:null;
const esJug=()=>!!SL&&SL.rol==='jugador'&&SL.puesto!=null;
const memP=p=>SL.mem.find(m=>m.puesto===p&&m.estado!=='expulsado');
const nomPuesto=p=>{const m=SL&&memP(p);return m&&m.nombre?m.nombre:'Jugador '+(p+1)};
const idPuesto=p=>{const m=SL&&memP(p);return m&&!m.anonimo?m.user_id:'sg'+(p+1)};
const toast=(t,ms)=>{document.querySelectorAll('.sl-toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='sl-toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2600)};
const sbUser=async()=>{try{const{data}=await sb.auth.getSession();return data&&data.session&&data.session.user||null}catch(e){return null}};
async function rpcSala(fn,args){try{const{data,error}=await sb.rpc(fn,args||{});if(error)return{ok:false,motivo:error.code?'error':'red',error};return data===null||data===undefined?{ok:true}:data}catch(e){return{ok:false,motivo:'red'}}}
/* Sesión anónima de Supabase para entrar como invitado (solo para unirse; no crea perfil) */

const MSG={codigo:'Ese código no existe o la sala ya no está activa.',intentos:'Demasiados intentos. Espera unos minutos y vuelve a probar.',expulsado:'El dueño te ha expulsado de esta partida.',sala_llena:'La sala está llena de espectadores.',puesto_ocupado:'Ese puesto ya está ocupado.',red:'No se ha podido conectar. Revisa tu conexión e inténtalo de nuevo.',error:'No se ha podido completar. Inténtalo de nuevo.',cerrada:'La partida ya no está disponible.',no_amigo:'Solo puedes invitar a tus amigos.',demasiadas_salas:'Ya tienes varias partidas conectadas abiertas.',nombre:'Algún nombre de equipo no está permitido. Elige otro.',limite:'Has llegado al límite. Inténtalo más tarde.',no_existe:'No se ha podido encontrar a ese jugador.',propio:'No puedes denunciarte a ti mismo.'};

/* ---------- Estado en vivo ---------- */
function nuevoSL(info,yo){
  return{id:info.id,codigo:info.codigo||'',rol:info.rol,puesto:info.puesto==null?null:+info.puesto,yo,cfg:{},duenoId:null,
    srv:{j:juegoVacio(),v:[0,0],g:0,seq:0},pend:[],mem:[],ev:[],buf:{},ok:null,lock:null,conn:'ok',pres:{},ch:null,hb:null,
    busy:false,drag:false,lastV:null,lastG:null,pick:null,menu:false,logO:false,plO:false,ordO:false,esperaO:false,ready:false,fin:false,cerrado:false,gapT:0,okMio:null}}
/* Lo que se ve: el estado del servidor + mis toques pendientes */
function vistaS(){
  let b=clon(SL.srv.j);b.ord=b.ord||[];
  for(const c of SL.pend){if(c.seq&&c.seq<=SL.srv.seq)continue;
    if(c.tipo==='juego'){b=clon(c.res)}else{b.eq[c.i]=clon(c.res.eq[c.i]);if(c.ficha)delete b.mesa[c.ficha]}}
  return b}
function limpiarPend(){SL.pend=SL.pend.filter(c=>!(c.seq&&c.seq<=SL.srv.seq))}
function espejo(){ // S.game sigue la forma de una partida normal para que Continuar, VS y demás funcionen
  if(!SL||SL.cerrado)return;const g=gDe(vistaS());
  S.game=Object.assign({},S.game&&S.game.sala&&S.game.sala.id===SL.id?S.game:{},g,{id:SL.id,sala:{id:SL.id,codigo:SL.codigo,rol:SL.rol,puesto:SL.puesto},
    p:[0,1,2,3].map(idPuesto),tn:SL.cfg.tn||['',''],am:SL.cfg.am?1:0,guest:AUTH==='guest'?1:0,inf:SL.cfg.inf?1:0,hist:[]});
  save()}
function nombresSala(){SL.mem.forEach(m=>{if(!m.anonimo&&m.nombre)SLNOM[m.user_id]=m.nombre})}

/* ---------- Entrar, conectar y soltar ---------- */
async function salaEntrar(info){
  salaSoltar();const u=await sbUser();
  SL=nuevoSL(info,u&&u.id);
  const ok=await resync();
  if(!ok&&!SL)return false;
  if(SL&&!SL.cerrado){conectar()}
  return !!SL&&SL.ready}
function salaSoltar(){
  if(!SL)return;clearInterval(SL.hb);clearTimeout(SL.gapT);SL.hb=null;
  if(SL.ch){try{sb.removeChannel(SL.ch)}catch(e){}SL.ch=null}}
function conectar(){
  if(!SL||SL.cerrado)return;
  if(SL.ch){try{sb.removeChannel(SL.ch)}catch(e){}SL.ch=null}
  const id=SL.id;
  const ch=sb.channel('sala:'+id,{config:{presence:{key:(SL.puesto!=null?'p'+SL.puesto:'e'+Math.random().toString(36).slice(2,6))}}});
  ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'sala_eventos',filter:'sala=eq.'+id},p=>{if(SL&&SL.id===id&&p&&p.new)recibir(p.new)});
  ch.on('presence',{event:'sync'},()=>{if(SL&&SL.id===id){try{SL.pres=ch.presenceState()}catch(e){}pintar()}});
  ch.subscribe(async st=>{
    if(!SL||SL.id!==id||SL.ch!==ch)return;
    if(st==='SUBSCRIBED'){try{await ch.track({rol:SL.rol,puesto:SL.puesto})}catch(e){}SL.conn='ok';resync()}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){SL.conn='off';pintar();reconectarLuego()}});
  SL.ch=ch;clearInterval(SL.hb);SL.hb=setInterval(latido,30000)}
function reconectarLuego(){if(!SL||SL.reT)return;SL.reT=setTimeout(async()=>{if(!SL)return;SL.reT=0;if(SL.conn==='ok')return;const ok=await resync();if(SL&&ok&&!SL.cerrado)conectar();else if(SL)reconectarLuego()},2500)}
async function latido(){
  if(!SL||SL.cerrado||document.hidden)return;
  const r=await rpcSala('sala_latido',{p_sala:SL.id});
  if(!SL)return;
  if(r.motivo==='red'){SL.conn='off';pintar();reconectarLuego();return}
  if(!r.ok){if(r.motivo==='expulsado')return salaTerminada('expulsado');if(r.motivo==='cerrada'||r.motivo==='no_miembro')return salaTerminada('cerrada');return}
  if(r.seq>SL.srv.seq&&!SL.busy)resync()}

/* Trae el estado completo (al entrar, al volver a la app y si se pierde algún evento) */
async function resync(){
  if(!SL)return false;const id=SL.id;
  try{
    const a=await sb.from('salas').select('estado,cfg,juego,v_eq,v_glob,seq,dueno,ok,codigo').eq('id',id).maybeSingle();
    const b=await sb.from('sala_miembros').select('user_id,rol,puesto,estado,nombre,anonimo').eq('sala',id);
    if(!SL||SL.id!==id)return false;
    if(a.error||b.error){SL.conn='off';pintar();return false}
    if(!a.data){salaTerminada('cerrada');return false}
    const s=a.data;
    SL.mem=(b.data||[]).filter(m=>m.estado!=='expulsado'||m.user_id===SL.yo);
    const yo=(b.data||[]).find(m=>m.user_id===SL.yo);
    if(yo){if(yo.estado==='expulsado'){salaTerminada('expulsado');return false}SL.rol=yo.rol;SL.puesto=yo.puesto==null?null:+yo.puesto}
    SL.cfg=s.cfg||{};SL.codigo=s.codigo||SL.codigo;SL.duenoId=s.dueno;nombresSala();
    if(s.seq>=SL.srv.seq){SL.srv={j:s.juego,v:s.v_eq,g:s.v_glob,seq:s.seq};Object.keys(SL.buf).forEach(k=>{if(+k<=s.seq)delete SL.buf[k]})}
    SL.ok=s.ok&&s.ok.estado?s.ok:null;
    limpiarPend();SL.conn='ok';SL.ready=true;
    if(s.estado==='terminada'){const f=await sb.from('sala_eventos').select('despues').eq('sala',id).eq('tipo','fin').maybeSingle();if(SL&&f.data&&f.data.despues)onFin(f.data.despues);else salaTerminada('cerrada');return false}
    if(s.estado==='cerrada'){salaTerminada('cerrada');return false}
    espejo();procesar();
    if(SL.ok&&SL.ok.estado==='aprobado'&&SL.ok.por===SL.puesto&&!SL.okMio)ejecutarOk(SL.ok.tipo);
    return true
  }catch(e){if(SL){SL.conn='off';pintar()}return false}}

/* Eventos que llegan por tiempo real: se aplican en orden; si falta alguno se vuelve a pedir el estado */
function recibir(row){if(!SL)return;if(row.seq>SL.srv.seq)SL.buf[row.seq]=row;procesar()}
function procesar(){
  if(!SL)return;
  while(SL.buf[SL.srv.seq+1]){const e=SL.buf[SL.srv.seq+1];delete SL.buf[e.seq];aplicarEv(e);if(!SL)return}
  Object.keys(SL.buf).forEach(k=>{if(+k<=SL.srv.seq)delete SL.buf[k]});
  clearTimeout(SL.gapT);if(Object.keys(SL.buf).length)SL.gapT=setTimeout(()=>{if(SL&&Object.keys(SL.buf).length)resync()},1500);
  limpiarPend();espejo();pintar()}
function aplicarEv(e){
  const d=e.despues||{},s=SL.srv;
  if(d.juego)s.j=d.juego;
  else{if(d.eq&&e.equipo!=null)s.j.eq[e.equipo]=d.eq;if(d.mesa)for(const[l,n]of Object.entries(d.mesa)){if(n==null)delete s.j.mesa[l];else s.j.mesa[l]=n}}
  if(d.v)s.v=d.v;if(d.g!=null)s.g=d.g;s.seq=e.seq;
  SL.ev.push(e);if(SL.ev.length>40)SL.ev.shift();
  const t=e.tipo;
  if(['suma','ficha_sumar','juego','deshacer'].includes(t)&&e.equipo===miEq()&&e.puesto!==SL.puesto){SL.lock={p:e.puesto,hasta:Date.now()+3000};setTimeout(()=>{if(SL)pintar()},3100)}
  if(t==='deshacer'&&e.antes&&e.antes.seq){const x=SL.ev.find(y=>y.seq===e.antes.seq);if(x)x.deshecho=true}
  if(['entra','sale','dueno','expulsion'].includes(t)){cargarMiembros();if(t==='expulsion'&&SL.rol==='jugador')setTimeout(latido,300)}
  if(t==='ok_pedido'||t==='ok_voto'){SL.ok=d.ok;if(t==='ok_pedido')avisoOk(d.ok)}
  if(t==='ok_aprobado'){SL.ok=d.ok;if(d.ok&&d.ok.por===SL.puesto&&!SL.okMio)ejecutarOk(d.ok.tipo)}
  if(t==='ok_rechazado'){SL.ok=null;SL.esperaO=false;document.querySelectorAll('#slok').forEach(x=>x.remove());if(e.puesto!==SL.puesto)toast(nomPuesto(e.puesto)+(d.cancelado?' ha cancelado la petición.':' ha dicho que no.'))}
  if(t==='reinicio'){SL.ok=null;SL.esperaO=false;SL.okMio=null;toast('Partida reiniciada.')}
  if(t==='fin')onFin(d);
  if(t==='cierre')salaTerminada('cerrada')}
async function cargarMiembros(){
  if(!SL)return;const id=SL.id;
  let b;try{b=await sb.from('sala_miembros').select('user_id,rol,puesto,estado,nombre,anonimo').eq('sala',id)}catch(e){return}
  if(!SL||SL.id!==id||b.error||!b.data)return;
  SL.mem=b.data.filter(m=>m.estado!=='expulsado'||m.user_id===SL.yo);
  const yo=b.data.find(m=>m.user_id===SL.yo);if(yo&&yo.estado!=='expulsado'){SL.rol=yo.rol;SL.puesto=yo.puesto==null?null:+yo.puesto}
  nombresSala();espejo();pintar()}
/* La sala se acabó (cierre, caducidad o expulsión): se avisa y se limpia */
function salaTerminada(motivo){
  if(!SL||SL.cerrado)return;SL.cerrado=true;salaSoltar();
  const msg=motivo==='expulsado'?'El dueño te ha expulsado de la partida.':'La partida se ha cerrado.';
  S.game=null;save();
  dlg(msg,{},()=>{SL=null;go('home')})}

/* ---------- Toques: se aplican al instante y se envían en orden; el servidor decide ---------- */
function puedeJugar(){return esJug()&&SL.ready&&SL.conn==='ok'&&!SL.cerrado&&!bloqueado()}
function bloqueado(){return !!(SL.lock&&SL.lock.p!==SL.puesto&&Date.now()<SL.lock.hasta)}
function tocar(n,ficha){
  if(!puedeJugar())return;
  const i=miEq(),j0=vistaS();
  if(!ficha&&n<0&&j0.eq[i].pts===0)return;
  const r=reglasSuma(j0,SL.cfg,i,n,ficha||null);
  const c={i,tipo:r.ev?'juego':(ficha?'ficha_sumar':'suma'),res:r.j,fin:r.fin};
  if(ficha){c.ficha=ficha;c.esp=j0.mesa[ficha]}

async function drain(){
  if(!SL||SL.busy)return;SL.busy=true;
  try{while(SL){
