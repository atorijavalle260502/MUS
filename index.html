/* Reclamar: la medalla nueva cae de golpe, sustituye a la actual y resplandece */

.mtop{display:flex;align-items:center;gap:14px}

.mtr .mhow{padding-top:7px;border-top:1px solid var(--line);font-size:.94em;line-height:1.3}
.mnota{font-size:11px;font-style:italic;color:var(--mute);line-height:1.3;text-align:left;margin-top:-2px}
.mtr .mhow small{display:block;color:var(--mute);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.72em;margin-bottom:2px}
.mhd.hp::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,226,120,.95) 0%,rgba(255,196,60,.65) 40%,rgba(255,196,60,0) 72%);filter:blur(4px);pointer-events:none;animation:medglow 1.8s ease-in-out infinite}
.mhd.hp>svg,.mhd.hp>.mdl{position:relative;z-index:1;animation:medlat 1.8s ease-in-out infinite}
.mold{display:block;animation:moldout .01s linear .4s forwards}
.mnew{position:absolute;left:0;top:0;animation:medcae .75s cubic-bezier(.55,0,1,.45) both,medres 1.9s ease-out .4s both}
@keyframes moldout{to{opacity:0}}
.mfly{position:fixed;width:88px;height:88px;z-index:99999;pointer-events:none;animation:medcae .9s cubic-bezier(.55,0,1,.45) both,medres 1.9s ease-out .47s both}
.mfly>*{display:block}
.mhd.hp .mnew>svg,.mhd.hp .mnew>.mdl{position:relative;z-index:1;animation:medlat 1.8s ease-in-out infinite}
@keyframes medcae{0%{transform:translateY(var(--fall,-190px)) scale(1.15);opacity:0}8%{opacity:1}52%{transform:translateY(0) scale(1)}64%{transform:translateY(-9px)}76%{transform:translateY(0)}86%{transform:translateY(-3px)}100%{transform:translateY(0)}}

.med.pend>svg,.med.pend>.mdl{position:relative;z-index:1;animation:medlat 1.8s ease-in-out infinite}

<script>

const help=k=>'<span class="hq" role="button" tabindex="0" data-help="'+k+'" aria-label="Ayuda">?</span>';
(function(){let pop=null;const close=()=>{if(pop){pop.remove();pop=null}};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.hq');
  if(b){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const same=pop&&pop._b===b;close();if(same)return;
    pop=document.createElement('div');pop.className='hpop';pop.textContent=HELP[b.dataset.help]||'';pop._b=b;document.body.appendChild(pop);
    const r=b.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
    const x=Math.min(vw-w-10,Math.max(10,r.left+r.width/2-w/2)),dn=r.bottom+12+h<vh-10,y=dn?r.bottom+12:r.top-12-h;
    pop.style.left=x+'px';pop.style.top=y+'px';pop.style.setProperty('--ax',(r.left+r.width/2-x)+'px');pop.classList.add(dn?'dn':'up');return}
  close()},true);
document.addEventListener('scroll',close,true);

})();
const KEY='mus-v2';

S.hist.forEach((h,i)=>{if(!h.id)h.id='h'+h.fecha+'x'+i});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fname=id=>{const f=S.friends.find(x=>x.id===id);return f?f.name:'(borrado)'};

{const c=S.cfg||{};if(!S.cfg||(+c.meta===40&&+c.juegos===3&&+c.vacas===3))S.cfg={meta:30,juegos:3,vacas:1};
{let t=S.friends.find(f=>!f.deleted&&f.id===S.me)||S.friends.find(f=>!f.deleted&&f.name.toLowerCase()==='tori');

  const out=()=>{if(!d.isConnected||d.dataset.x)return;d.dataset.x=1;window.removeEventListener('resize',fit);d.style.opacity=0;setTimeout(()=>d.remove(),400)};
  d.onclick=out;

/* Ajusta el contenido a la altura disponible: si no cabe, lo reduce (nunca se corta) */
function fitBox(root,boxSel,fitSel,center){
  root.querySelectorAll(boxSel).forEach(box=>{
    const f=box.querySelector(fitSel);if(!f)return;
    f.style.transform='';f.style.marginTop='';f.style.marginBottom='';
    const cs=getComputedStyle(box),av=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),need=f.offsetHeight;
    if(av>0&&need>av){const k=Math.max(.5,av/need);f.style.transform='scale('+k+')';
      if(center)f.style.marginTop=((av-need*k)/2)+'px';
      f.style.marginBottom=(-(need*(1-k)))+'px'}
  });
}
function victory(rec,i,A,B){
  const d=document.createElement('div');d.className='ov vic';
  const nMed=id=>{const a=A[id]||blank(),b=B[id];if(!b)return 0;return FAM.filter(m=>lvl(b,m.id)>lvl(a,m.id)).length+SEC.filter(m=>b.sec[m.id]&&!a.sec[m.id]).length};
  const tile=id=>{const f=S.friends.find(x=>x.id===id)||{},a=A[id]||blank(),b=B[id]||blank(),dl=b.tr-a.tr,nm=rec.am?0:nMed(id);
    return '<div class="vk"><div class="vk-av">'+avatarHTML(f,b,64)+'</div><div class="vk-nm">'+esc(fname(id))+'</div>'
    +(rec.am?'':'<div class="vk-d '+(dl>0?'up':dl<0?'dn':'')+'"><b>'+(dl>0?'+'+dl:dl<0?'−'+Math.abs(dl):'0')+'</b>'+trIcon(20)+'</div>')
    +(nm?'<div class="vk-md">'+(nm>1?nm+' medallas':'Medalla')+'</div>':'')+'</div>'};
  const pn=r=>{const ids=rec.t[r],won=r===i;
    return '<div class="mp vp'+(won?'':' def')+(r?' rot':'')+'"><div class="vc-fit"><small>'+(won?'¡Victoria!':'Derrota')+'</small><div class="vg">'+ids.map(tile).join('')+'</div>'+(rec.am?'<div class="vu">Partida amistosa · sin cambios en los amarracos</div>':'')+'</div></div>'};
  d.innerHTML=pn(1)+'<div class="row vrow"><button id="vx" type="button">Volver a inicio</button></div>'+pn(0);
  document.body.appendChild(d);rain(d,34,true,i===1);
  const fit=()=>fitBox(d,'.mp.vp','.vc-fit',false);fit();window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  d.querySelector('#vx').onclick=()=>{window.removeEventListener('resize',fit);bootTo(()=>{d.remove();go('home')})};
}

/* Pantalla de carga al volver al inicio: aparece con fundido, cambia a inicio por debajo y se retira */
function bootTo(fn){
  const de=document.documentElement;
  if(document.getElementById('boot')){fn();return}
  const b=document.createElement('div');b.id='boot';b.className='off';b.setAttribute('aria-hidden','true');
  b.innerHTML='<div class="bs"><svg viewBox="0 0 48 48"><use href="#su-o"/></svg><svg viewBox="0 0 48 48"><use href="#su-c"/></svg><svg viewBox="0 0 48 48"><use href="#su-e"/></svg><svg viewBox="0 0 48 48"><use href="#su-b"/></svg></div>';
  de.classList.add('bt');document.body.appendChild(b);
  const t0=Date.now();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    b.classList.remove('off');
    setTimeout(()=>{
      try{fn()}catch(e){console.error(e)}
      setTimeout(()=>requestAnimationFrame(()=>{
        b.classList.add('off');de.classList.remove('bt');
        setTimeout(()=>{if(b.parentNode)b.parentNode.removeChild(b)},450);
      }),Math.max(0,1000-(Date.now()-t0)));
    },380);
  }));
}

 function enhance(sel){
