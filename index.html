.av .ct img,.av .ct svg{width:100%;height:100%;display:block}.av .ct img{object-fit:cover}
.av .fl{position:absolute;left:calc(var(--u)*-.45);top:calc(var(--u)*-.5);width:calc(var(--u)*3.8);height:calc(var(--u)*4.15);pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.av.g9 .fl{filter:drop-shadow(0 0 7px rgba(255,205,80,.85)) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.av.lk{filter:grayscale(1) brightness(.6);opacity:.7}
.avb,.fr button.avb{background:none;padding:0;border:0;color:inherit;flex:0 0 auto}
.apk{display:flex;gap:12px;justify-content:center}
.apk button{padding:0;background:none;border:3px solid transparent;border-radius:50%;width:62px;height:62px;overflow:hidden}
.apk button.on{border-color:var(--gold);box-shadow:0 0 10px rgba(224,176,74,.7)}
.apk img{width:100%;height:100%;object-fit:cover;display:block}
.fpk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 2px}
.fpk button{background:none;color:var(--ink);padding:0 0 4px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:600;line-height:1.15;border-radius:10px;border:2px solid transparent;text-align:center}
.fpk button.on{border-color:var(--gold);background:rgba(224,176,74,.15)}
.fpk button.lk{color:var(--mute)}
</style>

        if(win){if(new Date(h.fecha).getHours()<8)un('noct');if(p.prev&&!p.prev.win&&p.prev.opp===ok)un('rev');if(pre[1-i]>=3)un('rom')}

}

function home(){
  app.innerHTML=corners(52,28)+'<div class="logo">MUS</div>'+fan()+'<div class="menu">'+(S.game?'<button class="gold" style="width:100%" id="cont">Continuar partida</button>':'')+'<button class="'+(S.game?'ghost" style="width:100%;background:var(--card)':'gold" style="width:100%')+'" id="go">Iniciar partida</button>'
  +'<button class="ghost" id="sd" style="width:100%;background:var(--card)">Senda del Órdago</button>'
  +'<div class="nav" style="margin-top:0"><button id="fr">Amigos</button><button id="mp">Mi perfil</button></div></div>';
  $('#go').onclick=()=>{if(live().length<4){dlg('Añade al menos 4 amigos en la biblioteca para empezar una partida.',{},()=>go('friends'))}else go('setup')};
  if($('#cont'))$('#cont').onclick=()=>go('game');
  $('#sd').onclick=()=>ensureMe(()=>go('senda'));
  $('#mp').onclick=()=>ensureMe(()=>{S.profile=S.me;profBack='home';go('profile')});
  $('#fr').onclick=()=>go('friends');
}

function friends(){
  const P=progress();
  app.innerHTML='<div class="top"><button id="b">‹ Inicio</button><h2>Biblioteca de amigos</h2></div>'
  +'<div class="card"><div class="row"><input id="n" placeholder="Nombre del amigo" maxlength="16"><button id="add" style="flex:0 0 auto">Añadir</button></div></div>'
  +'<div class="card" id="list"></div>';
  const l=$('#list');
  l.innerHTML=live().length?live().map(f=>{const p=P[f.id]||blank();return '<div class="fr"><span data-p="'+f.id+'" style="flex:1;min-width:0;cursor:pointer"><b>'+esc(f.name)+' ›</b><div>'+rankHTML(p,20)+'</div></span><span style="display:flex;gap:6px"><button data-e="'+f.id+'" style="color:var(--ink);border-color:var(--line)">Editar</button><button data-id="'+f.id+'">Quitar</button></span></div>'}).join('<div class="sep"></div>'):'<span style="color:var(--mute)">Aún no hay amigos. Añade a los que juegan contigo.</span>';
  if(live().length)l.insertAdjacentHTML('afterbegin','<div style="color:var(--mute);font-size:12px;margin-bottom:6px">Toca un nombre para ver su perfil y sus medallas</div>');
  const add=()=>{const v=$('#n').value.trim();if(!v)return;S.friends.push({id:'f'+Date.now(),name:v,medals:[]});save();friends()};
  $('#add').onclick=add;$('#n').onkeydown=e=>{if(e.key==='Enter')add()};
  l.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{S.profile=e.dataset.p;profBack='friends';go('profile')});
  l.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{dlg('¿Quitar de la biblioteca? Su historial se conserva.',{cancel:1,ok:'Quitar'},()=>{S.friends.find(f=>f.id===b.dataset.id).deleted=true;save();friends()})});
  l.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const f=S.friends.find(x=>x.id===b.dataset.e);dlg('Nuevo nombre',{input:f.name,cancel:1,ok:'Guardar'},v=>{if(v&&v.trim()){f.name=v.trim().slice(0,16);save();friends()}})});
  $('#b').onclick=()=>go('home');
}
function overlay(html){const d=document.createElement('div');d.className='ov c';d.innerHTML='<div class="mp" style="max-height:82vh;overflow-y:auto">'+html+'</div>';document.body.appendChild(d);return d}
function medalInfo(m,p){
  const r=p.md[m.id]||{lvl:0,t:[],w:[]},v=m.soon?0:m.val(stat(p)),nx=m.goals[r.lvl];
  const rows=m.goals.map((g,i)=>{const t=TITLES.find(x=>x.fam===m.id&&x.min===i+1),on=i<r.lvl;
    return '<div class="tr-row'+(on?' on':'')+'"><span class="dot" style="background:'+TIERC[i][0]+'"></span><div style="flex:1;min-width:0"><b>'+LV[i]+'</b> · '+esc(m.req(g))+(t?'<div class="rwt">Título «'+esc(t.text)+'»</div>':'')+'</div><span class="rwt" style="text-align:right">'+(on?'✓ '+dFmt(r.t[i])+(r.w[i]?'<br>con '+esc(fname(r.w[i])):''):'—')+'</span></div>'}).join('');
  const d=overlay('<div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">'+medal(m,r.lvl,88)+'<h2>'+esc(m.name)+'</h2><div style="color:var(--mute)">'+esc(m.desc)+'</div><b>'+medalLbl(m,r.lvl)+'</b></div>'
    +(m.soon?'<div style="color:var(--mute)">Disponible en una próxima versión.</div>':(nx!==undefined?'<div><div class="bar"><i style="width:'+Math.round(100*Math.min(v,nx)/nx)+'%"></i></div><div style="margin-top:4px">Siguiente nivel ('+LV[r.lvl]+'): '+fmt(Math.min(v,nx))+' / '+fmt(nx)+'</div></div>':'<div><b>¡Nivel máximo alcanzado!</b></div>'))
    +'<div class="tiers">'+rows+'</div><button id="dk">Cerrar</button>');
  d.querySelector('#dk').onclick=()=>d.remove();
}
function secInfo(m,p){
  const u=p.sec[m.id];
  const d=overlay('<div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">'+medal(m,u?SPEC:0,88)+'<h2>'+esc(m.name)+'</h2><div style="color:var(--mute)">'+esc(m.desc)+'</div><b>Medalla especial</b></div>'
    +'<div><b>Cómo se consigue:</b> '+esc(m.req)+(VER_PISTAS&&!u?'<div class="rwt">Esta pista solo se ve en el modo recordatorio.</div>':'')+'</div>'
    +(u?'<div><b>Desbloqueada:</b> '+dFmt(u.t)+'</div>':'<div style="color:var(--mute)">Aún sin conseguir</div>')+'<button id="dk">Cerrar</button>');
  d.querySelector('#dk').onclick=()=>d.remove();
}
function pickSlot(f,p,i){
  const cur=featured(f,p).map(m=>m.id);
  const opts=FAM.filter(m=>lvl(p,m.id)>0&&(!cur.includes(m.id)||cur[i]===m.id));
  const d=overlay('<b>Elige una medalla destacada</b>'+(opts.length?'<div class="mg">'+opts.map(m=>'<button class="med" data-a="'+m.id+'">'+medal(m,lvl(p,m.id),54)+'<span>'+esc(m.name)+'</span><small>'+medalLbl(m,lvl(p,m.id))+'</small></button>').join('')+'</div>':'<span style="color:var(--mute)">Aún no tienes medallas. Gana partidas para conseguirlas.</span>')+'<div class="row">'+(cur[i]?'<button class="ghost" id="rm">Quitar</button>':'')+'<button class="ghost" id="cx">Cancelar</button></div>');
  const done=n=>{f.medals=n.slice(0,4);save();d.remove();profile()};
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const n=cur.slice();if(i<n.length)n[i]=b.dataset.a;else n.push(b.dataset.a);done(n)});
  if(d.querySelector('#rm'))d.querySelector('#rm').onclick=()=>{const n=cur.slice();n.splice(i,1);done(n)};
  d.querySelector('#cx').onclick=()=>d.remove();
}

  app.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>pickSlot(f,p,+b.dataset.slot));
  app.querySelectorAll('.mg [data-a]').forEach(b=>b.onclick=()=>medalInfo(FAM.find(m=>m.id===b.dataset.a),p));
  app.querySelectorAll('.mg [data-s]').forEach(b=>b.onclick=()=>secInfo(SEC.find(m=>m.id===b.dataset.s),p));
}

function setup(){
  const P=progress();
  const opts=i=>'<option value="">Elige…</option>'+live().map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('');
  const sel=(id,t)=>'<label>'+t+'<select id="'+id+'">'+opts()+'</select><div id="sb'+id.slice(1)+'" style="min-height:22px"></div></label>';
  const c=S.cfg;
  app.innerHTML='<div class="top"><button id="b">‹ Inicio</button><h2>Nueva partida</h2></div>'
  +'<div class="card team" style="--c:var(--a);--cf:var(--af)"><b style="color:var(--a)">Pareja 1</b><div class="row">'+sel('p0','Jugador')+sel('p1','Jugador')+'</div></div>'
  +'<div class="card team" style="--c:var(--b);--cf:var(--bf)"><b style="color:var(--b)">Pareja 2</b><div class="row">'+sel('p2','Jugador')+sel('p3','Jugador')+'</div></div>'
  +'<div class="card"><div class="row"><label>Puntos por juego<input id="meta" type="number" min="5" value="'+c.meta+'" inputmode="numeric"></label>'
  +'<label>Juegos por vaca<input id="jv" type="number" min="1" value="'+c.juegos+'" inputmode="numeric"></label>'
  +'<label>Vacas<input id="vc" type="number" min="1" value="'+c.vacas+'" inputmode="numeric"></label></div></div>'
  +'<button class="gold" id="ok" style="margin-top:auto;padding:16px">Aceptar y empezar</button>';
  const prev=S.game&&S.game.p||[];prev.forEach((v,i)=>{const e=$('#p'+i);if(e&&live().some(f=>f.id===v))e.value=v});
  const used=new Set([0,1,2,3].map(i=>$('#p'+i).value).filter(Boolean));
  [0,1,2,3].forEach(i=>{const e=$('#p'+i);if(!e.value){const f=live().find(x=>!used.has(x.id));if(f){e.value=f.id;used.add(f.id)}}});
  const chk=()=>[0,1,2,3].forEach(i=>{const f=S.friends.find(x=>x.id===$('#p'+i).value);$('#sb'+i).innerHTML=f?rankHTML(P[f.id]||blank(),18):''});
  [0,1,2,3].forEach(i=>$('#p'+i).onchange=chk);chk();
  $('#b').onclick=()=>go('home');
  $('#ok').onclick=()=>{
    const p=[0,1,2,3].map(i=>$('#p'+i).value);
    if(p.some(x=>!x)||new Set(p).size<4){dlg('Elige cuatro jugadores distintos.',{});return}
    const n=k=>Math.max(1,parseInt($(k).value)||1);
    S.cfg={meta:Math.max(5,n('#meta')),juegos:n('#jv'),vacas:n('#vc')};
    S.game={id:uid(),p,pts:[0,0],jg:[0,0],vc:[0,0],hist:[],pal:[0,0],jt:[0,0]};save();go('game');vsIntro();
  };
}

const col=i=>i?'var(--b)':'var(--a)',colF=i=>i?'var(--bf)':'var(--af)';
const pair=i=>esc(fname(S.game.p[i*2]))+' y '+esc(fname(S.game.p[i*2+1]));
const ul=n=>String(n).replace(/[69]/g,d=>'<u class="u'+(d==='9'?' n9':'')+'">'+d+'</u>');
function half(i){
  const g=S.game,c=S.cfg,soon=c.meta-g.pts[i]<=5;
  return '<div class="half team'+(i?' rot':'')+'" data-t="'+i+'" style="--c:'+col(i)+';border-color:'+(soon?'var(--gold);box-shadow:0 0 14px var(--gold)':colF(i))+'">'
  +'<div class="fr"><b style="color:'+col(i)+'">'+pair(i)+'</b><span class="riv" style="--r:'+col(1-i)+'"><small>Rival</small><b>'+ul(g.pts[1-i])+'</b></span></div>'
  +'<div class="fr" style="flex-wrap:nowrap"><div class="big" style="--c:'+col(i)+'">'+ul(g.pts[i])+'<small style="font:14px Literata,system-ui;color:var(--mute)"> de '+c.meta+'</small></div><button class="ord" data-ord="1">Órdago</button></div>'
  +'<div class="btns" style="--c:'+col(i)+'"><button data-t="'+i+'" data-n="1">+1</button><button data-t="'+i+'" data-n="5">+5</button><button data-t="'+i+'" data-n="-1" style="background:none;color:'+col(i)+';border:1.5px solid '+col(i)+'">−1</button></div>'
  +'<div class="mini" style="--c:'+col(i)+'">'+[2,3,4,7,10].map(n=>'<button data-t="'+i+'" data-n="'+n+'">+'+n+'</button>').join('')+'</div></div>';
}
function strip(i){
  const g=S.game,c=S.cfg,soon=c.meta-g.pts[i]<=5,n=Math.ceil(c.meta/5);let d='';
  for(let k=0;k<n;k++){const f=Math.max(0,Math.min(5,g.pts[i]-k*5));
    d+='<div class="grp'+(k===n-1?' last'+(soon?' soon':''):'')+'">'+[0,1,2,3,4].map(j=>'<i class="dot'+(j<f?' on':'')+'"></i>').join('')+'</div>'}
  return '<div class="strip'+(i?' rot':'')+'" style="--c:'+colF(i)+'"><div class="dots">'+d+'</div><div class="cnt"><span>J '+ul(g.jg[i])+'</span><span>V '+ul(g.vc[i])+'</span></div></div>';
}
const LAN=[['G','Grande'],['C','Chica'],['P','Pares'],['J','Juego']];
let pick=null,sel=null;
const snap=g=>JSON.stringify({pts:g.pts,jg:g.jg,vc:g.vc,mesa:g.mesa||{}});
const LI={
G:'<path d="M3 17L2 7l5 4 5-7 5 7 5-4-1 10z" fill="#d9a82e" stroke="#7a5a10" stroke-width="1.3" stroke-linejoin="round"/><path d="M3 19.5h18" stroke="#7a5a10" stroke-width="2.5" stroke-linecap="round"/>',
C:'<circle cx="12" cy="12" r="10" fill="#d9a82e" stroke="#7a5a10" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="700" font-family="Literata,Georgia,serif" fill="#1d2a44">A</text>',
P:'<rect x="2.5" y="5" width="11" height="15" rx="2" fill="#fff" stroke="#1d2a44" stroke-width="1.4" transform="rotate(-14 8 12)"/><rect x="10.5" y="5" width="11" height="15" rx="2" fill="#f6efdc" stroke="#1d2a44" stroke-width="1.4" transform="rotate(14 16 12)"/>',
J:'<rect x="2" y="3" width="20" height="18" rx="4" fill="#f6efdc" stroke="#7a5a10" stroke-width="1.5"/><text x="12" y="18" text-anchor="middle" font-size="17" font-weight="700" font-family="Literata,Georgia,serif" fill="#1d2a44">J</text>'};
const lanceIcon=(l,s)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" aria-hidden="true">'+LI[l]+'</svg>';
const EXIT='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>';
let menu=false;
const chipHTML=(l,n)=>'<div class="chip" data-chip="'+l+'"><b style="color:#b3392f">'+ul(n)+'</b><b class="rot" style="color:#1d4f7a">'+ul(n)+'</b>'+lanceIcon(l,20)+(sel===l?'<button class="del" data-del="'+l+'" aria-label="Quitar puntos">✕</button>':'')+'</div>';
let ordOpen=false;
function ordPanel(rot){
  return '<div class="mp'+(rot?' rot':'')+'"><div class="fr"><b>¿Quién ha ganado el órdago?</b><button data-od="x">✕</button></div><div class="opts g1">'+[0,1].map(i=>'<button data-od="'+i+'" style="background:'+col(i)+';color:#fff">'+pair(i)+'</button>').join('')+'</div></div>';
}
function menuPanel(rot){
  return '<div class="mp'+(rot?' rot':'')+'"><b>Partida</b><div class="opts g1"><button data-menu="r">Reiniciar partida</button><button data-menu="s">Compartir partida</button><button data-menu="q">Salir al inicio</button><button class="ghost" data-menu="x">Seguir jugando</button></div></div>';
}
function pickPanel(rot){
  const l=pick,nm=LAN.find(x=>x[0]===l)[1],g=S.game;
  const b=Array.from({length:20},(_,i)=>i+1).map(n=>'<button data-amt="'+n+'">'+ul(n)+'</button>').join('')+(g.mesa[l]?'<button class="ghost" style="grid-column:span 2" data-amt="0">Quitar</button>':'')+'<button class="ghost" style="grid-column:span '+(g.mesa[l]?3:5)+'" data-amt="x">Cancelar</button>';
  return '<div class="mp'+(rot?' rot':'')+'"><b>'+nm+': ¿cuántos puntos?</b><div class="opts g5">'+b+'</div></div>';
}
function setChip(l,n){const g=S.game;g.hist.push(snap(g));g.mesa={...g.mesa};if(n)g.mesa[l]=n;else delete g.mesa[l];pick=null;save();game()}
function send(l,t){const g=S.game,n=g.mesa[l];if(!n)return;sel=null;add(t,n,l)}
function wire(){
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>add(+b.dataset.t,+b.dataset.n));
  app.querySelectorAll('[data-pick]').forEach(e=>e.onclick=()=>{pick=e.dataset.pick;sel=null;game()});
  app.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{const v=b.dataset.amt;if(v==='x'){pick=null;game()}else setChip(pick,+v)});
  app.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{ordOpen=true;game()});
  app.querySelectorAll('[data-od]').forEach(b=>b.onclick=()=>{const v=b.dataset.od,g=S.game;ordOpen=false;
    if(v==='x'){game();return}
    const w=+v;g.ord=[...(g.ord||[]),{w:g.p.slice(w*2,w*2+2),l:g.p.slice((1-w)*2,(1-w)*2+2)}];add(w,S.cfg.meta-g.pts[w])});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{sel=null;setChip(b.dataset.del,0)});
  app.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const v=b.dataset.menu,g=S.game;
    if(v==='x'){menu=false;game()}
    else if(v==='s'){menu=false;game();shareGame()}
    else if(v==='q'){menu=false;go('home')}
    else dlg('¿Reiniciar la partida? Se borran puntos, juegos, vacas y fichas.',{cancel:1,ok:'Reiniciar'},()=>{g.pts=[0,0];g.jg=[0,0];g.vc=[0,0];g.mesa={};g.hist=[];g.pal=[0,0];g.jt=[0,0];g.ord=[];menu=false;save();game()})});
  app.querySelectorAll('.chip').forEach(ch=>{
    let sx,sy,mv=false,on=false;
    ch.onpointerdown=e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;mv=false;on=true;ch.setPointerCapture(e.pointerId);ch.style.zIndex=20};
    ch.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mv=true;if(mv)ch.style.transform='translate('+dx+'px,'+dy+'px) scale(1.25)'};
    ch.onpointerup=e=>{
      if(!on)return;on=false;
      if(!mv){sel=sel===ch.dataset.chip?null:ch.dataset.chip;game();return}
      ch.style.visibility='hidden';
      const h=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('half'));
      ch.style.visibility='';
      if(h)send(ch.dataset.chip,+h.dataset.t);else game();
    };
    ch.onpointercancel=()=>{on=false;game()};
  });
}
function game(){
  const g=S.game;g.mesa=g.mesa||{};
  const cells=LAN.map(([l])=>'<div class="slot"><b class="cn" data-pick="'+l+'">'+l+'</b><b class="cn r rot" data-pick="'+l+'">'+l+'</b>'+(g.mesa[l]?chipHTML(l,g.mesa[l]):'<span class="plus" data-pick="'+l+'">'+lanceIcon(l,28)+'</span>')+'</div>').join('');
  app.innerHTML='<div class="table">'+half(1)+'<div class="mid">'+strip(1)+'<div class="mesa"><button class="sm" id="b" aria-label="Menú de la partida">'+EXIT+'</button>'+cells+'</div>'+strip(0)+'</div>'+half(0)+'</div>'+(pick?'<div class="ov">'+pickPanel(1)+pickPanel(0)+'</div>':'')+(menu?'<div class="ov">'+menuPanel(1)+menuPanel(0)+'</div>':'')+(ordOpen?'<div class="ov">'+ordPanel(1)+ordPanel(0)+'</div>':'');
  wire();
  $('#b').onclick=()=>{menu=true;pick=null;sel=null;game()};
}
function add(i,n,rec){
  const g=S.game,c=S.cfg;
  g.hist.push(snap(g));
  let ev=null;if(rec){g.mesa={...g.mesa};delete g.mesa[rec]}
  g.pts=[...g.pts];g.pts[i]=Math.max(0,g.pts[i]+n);
  if(g.pts[i]>=c.meta){
    if(g.pts[1-i]===0){g.pal=[...(g.pal||[0,0])];g.pal[i]++}
    if(g.jt){g.jt=[...g.jt];g.jt[i]++}
    g.jg=[...g.jg];g.jg[i]++;g.pts=[0,0];g.mesa={};ev='j';
    if(g.jg[i]>=c.juegos){g.vc=[...g.vc];g.vc[i]++;g.jg=[0,0];ev='v'}
    if(navigator.vibrate)navigator.vibrate(ev==='v'?[120,60,120,60,200]:200);
    if(g.vc[i]<c.vacas)fx(ev,i);
    if(g.vc[i]>=c.vacas){
      const rec={id:g.id||uid(),t:[[g.p[0],g.p[1]],[g.p[2],g.p[3]]],w:i,cfg:c,fecha:Date.now(),o:g.ord||[],pl:g.pal||[0,0],jt:g.jt},A=progress();S.hist.push(rec);const B=progress();
      S.game=null;save();go('home');victory(rec,i,A,B);return;
    }
  }
  save();game();
}

function rain(box,n,loop){
  for(let k=0;k<n;k++){const s=document.createElement('span');s.className='drop';
    s.style.cssText='left:'+(Math.random()*92)+'%;animation-duration:'+(2+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*(loop?3:1.2))+'s;animation-iteration-count:'+(loop?'infinite':'1')+';--r:'+(k%4<2?Math.round(Math.random()*50-25):Math.round(Math.random()*720-360))+'deg';
    s.innerHTML=suit(['o','c','e','b'][k%4],22+Math.round(Math.random()*14));box.appendChild(s)}
}
function fx(k,i){
  const v=k==='v',d=document.createElement('div');d.className='fx';
  d.innerHTML='<div class="flash" style="'+(v?'top:0;height:100%':(i?'top:0':'bottom:0'))+'"></div><div class="ficha f'+i+'"><b>'+(v?'V':'J')+'</b></div>';
  if(v)rain(d,26,false);
  document.body.appendChild(d);setTimeout(()=>d.remove(),v?3600:1600);
}
function vsIntro(){
  const g=S.game,H=S.hist,PG=progress(),rec=pred=>{let j=0,w=0;H.forEach(h=>[0,1].forEach(i=>{if(pred(h.t[i])){j++;if(h.w===i)w++}}));return[w,j]};
  const vw=n=>n+(n===1?' victoria':' victorias'),pt=n=>n+(n===1?' partida':' partidas');
  const d=document.createElement('div');d.className='ov vsi';
  const player=id=>{const f=S.friends.find(x=>x.id===id)||{},p=PG[id]||blank(),tt=titleOf(f,p);
    const med=featured(f,p);
    return '<div class="vs-pl">'+(tt?'<div class="vs-t">'+esc(tt)+'</div>':'')+'<div class="vs-n"><b>'+esc(fname(id))+'</b>'+rankHTML(p,22)+'</div>'+(med.length?'<div class="vs-m">'+med.map(m=>medal(m,lvl(p,m.id),32)).join('')+'</div>':'')+'</div>'};
  const grp=i=>{const ids=g.p.slice(i*2,i*2+2),key=[...ids].sort().join('|'),[w,j]=rec(t=>[...t].sort().join('|')===key);
    return '<div class="vs-g g'+i+'"><div class="vs-pls">'+player(ids[0])+player(ids[1])+'</div><div class="vs-bn" style="background:'+col(i)+'">'+(i?'Equipo azul':'Equipo rojo')+'</div><div class="vs-jt">Juntos: '+(j?vw(w)+' de '+pt(j):'primera partida')+'</div></div>'};
  d.innerHTML=grp(1)+'<div class="vs-badge">VS</div>'+grp(0);
  document.body.appendChild(d);
  const out=()=>{if(!d.isConnected||d.dataset.x)return;d.dataset.x=1;d.style.opacity=0;setTimeout(()=>d.remove(),400)};
  d.onclick=out;
}
function victory(rec,i,A,B){
  const d=document.createElement('div'),nm=rec.t[i].map(x=>esc(fname(x))).join(' y ');d.className='ov vic';
  const ids=[...rec.t[i],...rec.t[1-i]];
  const rows=ids.map(id=>{const a=A[id]||blank(),b=B[id],dl=b.tr-a.tr,L=b.last||{};
    const ex=L.win&&(L.bi||L.bp)?' <small>racha +'+L.bi+' · pareja +'+L.bp+'</small>':'';
    return '<div class="vr"><span>'+esc(fname(id))+ex+'</span><b style="color:'+(dl>0?'#8fe3a0':dl<0?'#ff9a8d':'#d9ceb4')+'">'+(dl>0?'+'+dl:dl<0?'−'+Math.abs(dl):'0')+'</b><span class="vt">'+trIcon(14)+fmt(b.tr)+'</span></div>'+(b.lg>a.lg?'<div class="vu">▲ '+esc(fname(id))+' asciende a '+LEAGUES[b.lg][0]+'</div>':'')}).join('');
  const news=[];ids.forEach(id=>{const a=A[id]||blank(),b=B[id];FAM.forEach(m=>{const x=lvl(b,m.id);if(x>lvl(a,m.id))news.push([id,m,x])});SEC.forEach(m=>{if(b.sec[m.id]&&!a.sec[m.id])news.push([id,m,SPEC])})});
  const nw=!news.length?'':news.length<=2?news.map(([id,m,x])=>'<div class="vm">'+medal(m,x,22)+'<span>'+esc(fname(id))+': '+esc(m.name)+' · '+(x>=SPEC?'¡especial!':LV[x-1])+'</span></div>').join(''):'<div class="vm" style="justify-content:center;flex-wrap:wrap">'+news.slice(0,8).map(([id,m,x])=>medal(m,x,26)).join('')+'</div><div class="vm" style="justify-content:center"><span>'+news.length+' mejoras de medalla · míralas en los perfiles</span></div>';
  const pn=r=>'<div class="mp vp'+(r?' rot':'')+'">'+corners(30,45)+'<small>¡Victoria!</small><h2>'+nm+'</h2><div class="vl">'+rows+'</div>'+(nw?'<div class="vl">'+nw+'</div>':'')+'</div>';
  d.innerHTML=pn(1)+'<div class="row"><button id="vs" style="background:var(--gold);color:#1d2a44">Compartir resultado</button><button id="vx" style="background:var(--card);color:var(--ink)">Cerrar</button></div>'+pn(0);
  document.body.appendChild(d);rain(d,34,true);
  d.querySelector('#vx').onclick=()=>d.remove();
  d.querySelector('#vs').onclick=()=>shareResult(rec);
}

if(S.game&&S.game.pts)view='home';
draw();
{const h=location.hash.slice(1);if(h)tryImport(h,true)}
</script>
