<style>
:root{--felt:#1f5a3a;--felt2:#17472d;--card:#f6efdc;--ink:#1d2a44;--mute:#6d6a5f;--a:#b3392f;--b:#1d4f7a;--af:#f0867a;--bf:#6fb0e6;--gold:#c8962b;--line:#d9ceb4;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#123423;--felt2:#0d281a;--card:#232c44;--ink:#f1e8d0;--mute:#9aa0b3;--a:#e2675a;--b:#6fb0e6;--gold:#e0b04a;--line:#34405f}}
:root[data-theme="dark"]{--felt:#123423;--felt2:#0d281a;--card:#232c44;--ink:#f1e8d0;--mute:#9aa0b3;--a:#e2675a;--b:#6fb0e6;--gold:#e0b04a;--line:#34405f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--felt2);color:var(--ink);font-family:"Avenir Next",system-ui,sans-serif;max-width:520px;margin:0 auto}
#app{height:100%;min-height:0;overflow-y:auto;overscroll-behavior:none;display:flex;flex-direction:column;gap:12px;padding:28px 22px;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));box-shadow:inset 0 0 0 8px #101010,inset 0 0 0 11px var(--gold),inset 0 0 0 13px #101010}

h2{font:700 22px Georgia,serif;margin:0}

.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}

.del{position:absolute;top:-13px;right:-13px;width:28px;height:28px;border-radius:50%;background:#b3392f;color:#fff;padding:0;font-size:14px;z-index:5;border:2px solid #f6efdc}
.opts.g1{grid-template-columns:1fr}.plus svg{opacity:.6}
.ov.c{justify-content:center}.ov.c .mp{flex:0 0 auto}
textarea{font-size:16px;font-family:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);width:100%}.card td,.card th{font-size:13px}
.half .ord{padding:9px 14px;background:#f2b705;color:#1d2a44;font:700 15px Georgia,serif;border:0;flex:0 0 auto}
.fx{position:fixed;inset:0;max-width:520px;margin:0 auto;pointer-events:none;z-index:30;overflow:hidden}
.flash{position:absolute;left:0;right:0;height:50%;background:radial-gradient(ellipse at center,rgba(242,183,5,.8),rgba(242,183,5,0) 72%);opacity:0;animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.ficha{position:absolute;left:50%;margin-left:-37px;width:74px;height:100px;background:#f6efdc;border:3px solid #c8962b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0}
.ficha b{font:700 64px/1 Georgia,serif;color:#000}
.f0{top:62%;animation:up0 1.4s ease-out forwards}.f1{top:calc(38% - 100px);animation:up1 1.4s ease-out forwards}
@keyframes up0{0%{transform:translateY(30px) scale(.5);opacity:0}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{transform:translateY(-200px) scale(1);opacity:0}}
@keyframes up1{0%{transform:rotate(180deg) translateY(30px) scale(.5);opacity:0}20%{opacity:1;transform:rotate(180deg) translateY(0) scale(1.1)}100%{transform:rotate(180deg) translateY(-200px) scale(1);opacity:0}}
.drop{position:absolute;top:-50px;pointer-events:none;animation-name:fall;animation-timing-function:linear;animation-fill-mode:both}

.vic{overflow:hidden}.vic .mp{align-items:center;justify-content:center;text-align:center}.vp h2{font-size:26px;color:var(--ink)}.vp small{font:700 14px Georgia,serif;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.vp .sub{color:var(--mute)}

    if(v==='x'){game();return}
    const w=+v;g.ord=[...(g.ord||[]),{w:g.p.slice(w*2,w*2+2),l:g.p.slice((1-w)*2,(1-w)*2+2)}];add(w,S.cfg.meta-g.pts[w])});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{sel=null;setChip(b.dataset.del,0)});
  app.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const v=b.dataset.menu,g=S.game;
    if(v==='x'){menu=false;game()}
    else if(v==='s'){menu=false;game();shareGame()}
    else if(v==='q'){menu=false;go('home')}
    else dlg('¿Reiniciar la partida? Se borran puntos, juegos, vacas y fichas.',{cancel:1,ok:'Reiniciar'},()=>{g.pts=[0,0];g.jg=[0,0];g.vc=[0,0];g.mesa={};g.hist=[];g.pal=[0,0];g.jt=[0,0];g.ord=[];menu=false;save();game()})});
  app.querySelectorAll('.chip').forEach(ch=>{
    let sx,sy,mv=false,on=false;
    ch.onpointerdown=e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;mv=false;on=true;ch.setPointerCapture(e.pointerId);ch.style.zIndex=20};
    ch.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mv=true;if(mv)ch.style.transform='translate('+dx+'px,'+dy+'px) scale(1.25)'};
    ch.onpointerup=e=>{
      if(!on)return;on=false;
      if(!mv){sel=sel===ch.dataset.chip?null:ch.dataset.chip;game();return}
      ch.style.visibility='hidden';
      const h=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('half'));
      ch.style.visibility='';
      if(h)send(ch.dataset.chip,+h.dataset.t);else game();
    };
    ch.onpointercancel=()=>{on=false;game()};
  });
}
function game(){
  const g=S.game;g.mesa=g.mesa||{};
  const cells=LAN.map(([l])=>'<div class="slot"><b class="cn" data-pick="'+l+'">'+l+'</b><b class="cn r rot" data-pick="'+l+'">'+l+'</b>'+(g.mesa[l]?chipHTML(l,g.mesa[l]):'<span class="plus" data-pick="'+l+'">'+lanceIcon(l,28)+'</span>')+'</div>').join('');
  app.innerHTML='<div class="table">'+half(1)+'<div class="mid">'+strip(1)+'<div class="mesa"><button class="sm" id="b" aria-label="Menú de la partida">'+EXIT+'</button>'+cells+'</div>'+strip(0)+'</div>'+half(0)+'</div>'+(pick?'<div class="ov">'+pickPanel(1)+pickPanel(0)+'</div>':'')+(menu?'<div class="ov">'+menuPanel(1)+menuPanel(0)+'</div>':'')+(ordOpen?'<div class="ov">'+ordPanel(1)+ordPanel(0)+'</div>':'');
  wire();
  $('#b').onclick=()=>{menu=true;pick=null;sel=null;game()};
}
function add(i,n,rec){
  const g=S.game,c=S.cfg;
  g.hist.push(snap(g));
  let ev=null;if(rec){g.mesa={...g.mesa};delete g.mesa[rec]}
  g.pts=[...g.pts];g.pts[i]=Math.max(0,g.pts[i]+n);
  if(g.pts[i]>=c.meta){
    if(g.pts[1-i]===0){g.pal=[...(g.pal||[0,0])];g.pal[i]++}
    if(g.jt){g.jt=[...g.jt];g.jt[i]++}
    g.jg=[...g.jg];g.jg[i]++;g.pts=[0,0];g.mesa={};ev='j';
    if(g.jg[i]>=c.juegos){g.vc=[...g.vc];g.vc[i]++;g.jg=[0,0];ev='v'}
    if(navigator.vibrate)navigator.vibrate(ev==='v'?[120,60,120,60,200]:200);
    if(g.vc[i]<c.vacas)fx(ev,i);
    if(g.vc[i]>=c.vacas){
      const rec={id:g.id||uid(),t:[[g.p[0],g.p[1]],[g.p[2],g.p[3]]],w:i,cfg:c,fecha:Date.now(),o:g.ord||[],pl:g.pal||[0,0],jt:g.jt},A=progress();S.hist.push(rec);const B=progress();
      S.game=null;save();go('home');victory(rec,i,A,B);return;
    }
  }
  save();game();
}

function rain(box,n,loop){
  for(let k=0;k<n;k++){const s=document.createElement('span');s.className='drop';
    s.style.cssText='left:'+(Math.random()*92)+'%;animation-duration:'+(2+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*(loop?3:1.2))+'s;animation-iteration-count:'+(loop?'infinite':'1')+';--r:'+(k%4<2?Math.round(Math.random()*50-25):Math.round(Math.random()*720-360))+'deg';
    s.innerHTML=suit(['o','c','e','b'][k%4],22+Math.round(Math.random()*14));box.appendChild(s)}
}
function fx(k,i){
  const v=k==='v',d=document.createElement('div');d.className='fx';
  d.innerHTML='<div class="flash" style="'+(v?'top:0;height:100%':(i?'top:0':'bottom:0'))+'"></div><div class="ficha f'+i+'"><b>'+(v?'V':'J')+'</b></div>';
  if(v)rain(d,26,false);
  document.body.appendChild(d);setTimeout(()=>d.remove(),v?3600:1600);
}
function vsIntro(){
  const g=S.game,H=S.hist,PG=progress(),rec=pred=>{let j=0,w=0;H.forEach(h=>[0,1].forEach(i=>{if(pred(h.t[i])){j++;if(h.w===i)w++}}));return[w,j]};
  const vw=n=>n+(n===1?' victoria':' victorias'),pt=n=>n+(n===1?' partida':' partidas');
  const d=document.createElement('div');d.className='ov vsi';
  const player=id=>{const f=S.friends.find(x=>x.id===id)||{},p=PG[id]||blank(),tt=titleOf(f,p);
    const med=featured(f,p);
    return '<div class="vs-pl">'+(tt?'<div class="vs-t">'+esc(tt)+'</div>':'')+'<div class="vs-n"><b>'+esc(fname(id))+'</b>'+rankHTML(p,22)+'</div>'+(med.length?'<div class="vs-m">'+med.map(m=>medal(m,lvl(p,m.id),32)).join('')+'</div>':'')+'</div>'};
  const grp=i=>{const ids=g.p.slice(i*2,i*2+2),key=[...ids].sort().join('|'),[w,j]=rec(t=>[...t].sort().join('|')===key);
    return '<div class="vs-g g'+i+'"><div class="vs-pls">'+player(ids[0])+player(ids[1])+'</div><div class="vs-bn" style="background:'+col(i)+'">'+(i?'Equipo azul':'Equipo rojo')+'</div><div class="vs-jt">Juntos: '+(j?vw(w)+' de '+pt(j):'primera partida')+'</div></div>'};
  d.innerHTML=grp(1)+'<div class="vs-badge">VS</div>'+grp(0);
  document.body.appendChild(d);
  const out=()=>{if(!d.isConnected||d.dataset.x)return;d.dataset.x=1;d.style.opacity=0;setTimeout(()=>d.remove(),400)};
  d.onclick=out;
}
function victory(rec,i,A,B){
  const d=document.createElement('div'),nm=rec.t[i].map(x=>esc(fname(x))).join(' y ');d.className='ov vic';
  const ids=[...rec.t[i],...rec.t[1-i]];
  const rows=ids.map(id=>{const a=A[id]||blank(),b=B[id],dl=b.tr-a.tr,L=b.last||{};
    const ex=L.win&&(L.bi||L.bp)?' <small>racha +'+L.bi+' · pareja +'+L.bp+'</small>':'';
    return '<div class="vr"><span>'+esc(fname(id))+ex+'</span><b style="color:'+(dl>0?'#8fe3a0':dl<0?'#ff9a8d':'#d9ceb4')+'">'+(dl>0?'+'+dl:dl<0?'−'+Math.abs(dl):'0')+'</b><span class="vt">'+trIcon(14)+fmt(b.tr)+'</span></div>'+(b.lg>a.lg?'<div class="vu">▲ '+esc(fname(id))+' asciende a '+LEAGUES[b.lg][0]+'</div>':'')}).join('');
  const news=[];ids.forEach(id=>{const a=A[id]||blank(),b=B[id];FAM.forEach(m=>{const x=lvl(b,m.id);if(x>lvl(a,m.id))news.push([id,m,x])});SEC.forEach(m=>{if(b.sec[m.id]&&!a.sec[m.id])news.push([id,m,SPEC])})});
  const nw=!news.length?'':news.length<=2?news.map(([id,m,x])=>'<div class="vm">'+medal(m,x,22)+'<span>'+esc(fname(id))+': '+esc(m.name)+' · '+(x>=SPEC?'¡especial!':LV[x-1])+'</span></div>').join(''):'<div class="vm" style="justify-content:center;flex-wrap:wrap">'+news.slice(0,8).map(([id,m,x])=>medal(m,x,26)).join('')+'</div><div class="vm" style="justify-content:center"><span>'+news.length+' mejoras de medalla · míralas en los perfiles</span></div>';
  const pn=r=>'<div class="mp vp'+(r?' rot':'')+'">'+corners(30,45)+'<small>¡Victoria!</small><h2>'+nm+'</h2><div class="vl">'+rows+'</div>'+(nw?'<div class="vl">'+nw+'</div>':'')+'</div>';
  d.innerHTML=pn(1)+'<div class="row"><button id="vs" style="background:var(--gold);color:#1d2a44">Compartir resultado</button><button id="vx" style="background:var(--card);color:var(--ink)">Cerrar</button></div>'+pn(0);
  document.body.appendChild(d);rain(d,34,true);
  d.querySelector('#vx').onclick=()=>d.remove();
  d.querySelector('#vs').onclick=()=>shareResult(rec);
}

if(S.game&&S.game.pts)view='home';
draw();
{const h=location.hash.slice(1);if(h)tryImport(h,true)}
</script>
